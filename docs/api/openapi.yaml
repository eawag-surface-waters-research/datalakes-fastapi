openapi: 3.1.0

info:
  title: Datalakes API
  version: 3.0.0-draft
  license:
    name: MIT
    identifier: MIT
  description: |
    ## Conventions

    ### Format

    - JSON with `snake_case` field names.
    - Times are ISO 8601 in UTC, e.g. `2024-03-01T00:00:00Z`. Query parameters accept a date (`2024-03-01`) or a full timestamp.
    - Datasets are identified by their integer `id` Collections can also be addressed by their URL-safe `slug`.

    ### Lists

    Lists are paginated with `limit` (default 100, max 1000) and `offset`, and wrapped in an envelope:

    ```json
    {"items": [], "total": 250, "limit": 100, "offset": 0}
    ```

    ### Errors

    Errors have a human-readable `detail` and a machine-readable `code`:

    ```json
    {"detail": "Dataset 999 not found", "code": "not_found"}
    ```
    ### Background work

    The API process only reads. Syncing, inspecting files, building Zarr stores and preparing exports run in a worker. Endpoints that start such work answer `202 Accepted` with a job. Its progress can be followed at `GET /jobs/{job_id}`.

    ### Adding data

    1. Create a dataset: `POST /datasets`.
    2. Point it at its files: `PUT /datasets/{dataset_id}/source`. Sources are only read anonymously.
    3. Browse the source: `GET /datasets/{dataset_id}/source/files`.
    4. Get suggested variables from a sample file: `POST /datasets/{dataset_id}/inspect`, then poll the job.
    5. Create the variables: `POST /datasets/{dataset_id}/variables`.
    6. Sync: `POST /datasets/{dataset_id}/sync`, then poll the job. Afterwards an external system or a schedule triggers the syncs.

    ### Data versions

    A dataset's `version` goes up whenever its data or metadata changes. Responses send it as an `ETag` header, so clients and caches can tell when data has changed.

    ### Access

    Each operation's description says who will be allowed to call it afterwards:

    | Role | Who | Can |
    |---|---|---|
    | Public | Anyone, without signing in | Read published datasets, drafts by ID, data, availability and downloads |
    | User | Anyone signed in with GitHub | Everything public, plus create datasets and modify the ones they created |
    | Owner | A member of the Datalakes GitHub team | Everything, on all datasets, plus the maintenance endpoints |
    | Sync token | External sync-triggering systems, one token per dataset | Trigger a sync of that one dataset |

servers:
  - url: http://localhost:8000
    description: Local development

security: []

tags:
  # Metadata
  - name: Datasets
    description: Find, create, update and delete datasets. Published datasets are listed. Drafts are left out of lists but can be read by ID. Link datasets only point to an external page.
  - name: Variables
    description: The variables of a dataset, with their name in the source files, role, dimensions, unit, parameter and sensor.
  - name: Sites
    description: Places where data is measured, such as lakes, rivers or stations.
  - name: Collections
    description: Groups of datasets, e.g. a project or a platform such as LéXPLORE.
  - name: Issues
    description: What affected a dataset's data during a period, limited to a time range and optionally to a variable or a depth range. Either a problem with the data, such as maintenance, a sensor fault or a calibration, or an event that explains it, such as a storm or ice cover.
  - name: Vocabularies
    description: Shared lists used in metadata, such as parameters, organisations, persons, sensors, licenses, site types, feature types and variable roles.
  # Ingestion
  - name: Sources
    description: Where a dataset's files come from, either a public S3 bucket or a SWITCHdrive public share. Sources are read anonymously, and configs containing credentials are rejected.
  - name: Sync
    description: Copy new files from a dataset's source and process them, inspect a sample file to suggest variables, and check whether a live dataset is up to date. Syncing and inspecting run as jobs.
  - name: Jobs
    description: Background work run by the worker, with its status, progress, errors, log and result.
  - name: Files
    description: The file index, listing every file copied from a dataset's source with its size, time range and processing status.
  # Data
  - name: Data
    description: Read a dataset's values for a time and depth range, its latest values or its profile casts, as JSON, CSV or NetCDF.
  - name: Availability
    description: When data exists, per dataset and variable, and which datasets have data in a given period and area.
  - name: Exports
    description: Large downloads, prepared in the background. Identical requests share one export.
  # Maintenance
  - name: Maintenance
    description: Clear a dataset's cache, rebuild datasets, and manage the sync tokens that external callers use. Owners only.

paths:
  # ---------------------------------------------------------------------------
  # Datasets
  # ---------------------------------------------------------------------------
  /datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: List datasets
      description: |
        Lists published datasets, each with a summary of the parameters it measures.

        - **Drafts** are left out unless `status=draft` is requested.
        - **Link datasets** are listed like other datasets. They have no variables, so their `parameters` list is empty, and they have no extents, so the `start`/`end` filter leaves them out.

        All filters combine with AND.

        **Access:** public. Listing drafts (`status=draft`): owner, or user for the drafts they created.
      parameters:
        - name: q
          in: query
          description: Text to search for in the title and description, case-insensitive.
          schema:
            type: string
          example: thermistor
        - name: site_id
          in: query
          description: Only datasets at this site.
          schema:
            type: integer
          example: 1
        - name: parameter
          in: query
          description: Only datasets with a variable measuring this parameter (an ID from the `parameters` vocabulary).
          schema:
            type: integer
          example: 5
        - name: collection
          in: query
          description: Only datasets in this collection, by ID or slug.
          schema:
            type: string
          example: lexplore
        - name: feature_type
          in: query
          description: Only datasets of this feature type.
          schema:
            $ref: "#/components/schemas/FeatureTypeName"
          example: timeSeriesProfile
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - $ref: "#/components/parameters/bbox"
        - name: status
          in: query
          description: List published datasets (default) or drafts.
          schema:
            type: string
            enum: [published, draft]
            default: published
          example: draft
        - name: sort
          in: query
          description: |
            - `title`: alphabetically.
            - `recent`: latest data first (by `time_end`). Datasets without data come last.
            - `downloads`: most downloaded first.
          schema:
            type: string
            enum: [title, recent, downloads]
            default: title
          example: recent
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of datasets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPage"
              examples:
                lexplore:
                  summary: Temperature datasets in the LéXPLORE collection
                  value:
                    items:
                      - id: 123
                        title: LéXPLORE thermistor chain
                        description: Water temperature from 0.5 m to 110 m below the LéXPLORE platform on Lake Geneva, every 10 minutes.
                        status: published
                        kind: data
                        external_url: null
                        feature_type: timeSeriesProfile
                        site_id: 1
                        person_id: 1
                        organisation_id: 1
                        license_id: 1
                        repository_url: null
                        origin: measurement
                        citation: LéXPLORE thermistor chain, Eawag.
                        datasource_link: null
                        plot_config:
                          colors: Rainbow
                          time_axis: x
                          map_marker: marker
                        update_interval: 3600
                        sync_interval: null
                        latitude: 46.5004
                        longitude: 6.6588
                        time_start: "2019-03-07T00:00:00Z"
                        time_end: "2024-10-29T23:50:00Z"
                        depth_min: 0.5
                        depth_max: 110.0
                        downloads: 1520
                        version: 14
                        created_at: "2019-03-20T09:12:00Z"
                        updated_at: "2024-10-30T00:05:00Z"
                        parameters:
                          - id: 5
                            name: Water temperature
                            unit: degC
                    total: 1
                    limit: 100
                    offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Datasets]
      operationId: createDataset
      summary: Create a dataset
      description: |
        Creates a dataset. New datasets are drafts unless `status` says otherwise, so they can be set up before they're listed.

        - A **data dataset** (`kind: data`, the default) gets its variables and source afterwards, through their own endpoints.
        - A **link dataset** (`kind: link`) only describes data shown elsewhere. It needs `external_url`, and can't have variables or a source.

        The ID is always assigned automatically. `kind` can't be changed later.

        **Access:** user. The creator can then modify the dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
            examples:
              data:
                summary: A data dataset, as a draft
                value:
                  title: Lake Geneva CTD casts at SHL2
                  description: Monthly CTD casts at the deepest point of Lake Geneva (SHL2), from the surface to 309 m.
                  feature_type: profile
                  site_id: 1
                  person_id: 1
                  organisation_id: 1
                  license_id: 1
                  origin: measurement
              link:
                summary: A link dataset
                value:
                  title: Lake Geneva 3D hydrodynamic model
                  description: Delft3D-Flow simulation of Lake Geneva, with forecasts. Shown on Alplakes.
                  status: published
                  kind: link
                  external_url: https://www.alplakes.eawag.ch/geneva
                  site_id: 1
                  organisation_id: 1
                  latitude: 46.45
                  longitude: 6.55
      responses:
        "201":
          description: The dataset was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetail"
              examples:
                draft:
                  $ref: "#/components/examples/DraftDataset"
                link:
                  $ref: "#/components/examples/LinkDataset"
        "422":
          description: The dataset is invalid, e.g. a link dataset without `external_url`, or a site that doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                link_without_url:
                  summary: A link dataset without external_url
                  value:
                    detail: A link dataset needs an external_url
                    code: validation_error
                    errors:
                      - loc: [body, external_url]
                        msg: Required for link datasets
                unknown_site:
                  summary: The site doesn't exist
                  value:
                    detail: Site 999 not found
                    code: unknown_reference
                    errors:
                      - loc: [body, site_id]
                        msg: Site 999 not found

  /datasets/{dataset_id}:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get a dataset
      description: |
        Returns a dataset's metadata with its site, variables, collections and a summary of its source.

        - **Drafts** are returned too: they're only left out of lists.
        - **Link datasets** have no variables and no source. Their data is at `external_url`.

        **Access:** public.
      responses:
        "200":
          description: The dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetail"
              examples:
                thermistor_chain:
                  $ref: "#/components/examples/ThermistorChainDataset"
                draft:
                  $ref: "#/components/examples/DraftDataset"
                link:
                  $ref: "#/components/examples/LinkDataset"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Datasets]
      operationId: updateDataset
      summary: Update a dataset
      description: |
        Only the fields sent are changed, and the others stay as they are. `null` clears a field. Every change increases `version`.

        - Publish a draft with `{"status": "published"}`, or hide a dataset again with `{"status": "draft"}`.
        - `kind` can't be changed. A link dataset can't lose its `external_url`.

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
            examples:
              publish:
                summary: Publish a draft
                value:
                  status: published
              live:
                summary: Mark as live, updated every 20 minutes
                value:
                  update_interval: 1200
      responses:
        "200":
          description: The updated dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetail"
              examples:
                thermistor_chain:
                  $ref: "#/components/examples/ThermistorChainDataset"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Datasets]
      operationId: deleteDataset
      summary: Delete a dataset
      description: |
        Deletes the dataset and everything that belongs to it: variables, issues, source, file index, jobs and collection memberships. Derived data (raw files, Zarr stores, exports, cache) is removed in the background.

        **Access:** user (own datasets) or owner.
      responses:
        "204":
          description: The dataset was deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Variables
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/variables:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Variables]
      operationId: listVariables
      summary: List a dataset's variables
      description: |
        Lists the variables of a dataset: coordinates (time, depth…) first, then data and flag variables.

        Variables migrated from the old system have a `legacy_axis`. Use it to translate the `axis:[...]` part of an old link (e.g. `axis:[x,y,z]`) into variable names.

        - **Drafts:** their variables are returned like any other.
        - **Link datasets** have no variables, so the list is empty.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of variables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariablePage"
              examples:
                thermistor_chain:
                  summary: The variables of a thermistor chain
                  value:
                    items:
                      - id: 901
                        dataset_id: 123
                        name: time
                        source_name: time
                        role: time
                        dimensions: [time]
                        unit: null
                        parameter_id: 1
                        sensor_id: null
                        flag_for: null
                        legacy_axis: x
                        description: null
                        decoding:
                          time_units: seconds since 1970-01-01 00:00:00
                      - id: 902
                        dataset_id: 123
                        name: depth
                        source_name: depth
                        role: coordinate
                        dimensions: [depth]
                        unit: m
                        parameter_id: 2
                        sensor_id: null
                        flag_for: null
                        legacy_axis: y
                        description: Depth of each logger below the surface
                        decoding: null
                      - id: 903
                        dataset_id: 123
                        name: temperature
                        source_name: temp
                        role: data
                        dimensions: [time, depth]
                        unit: degC
                        parameter_id: 5
                        sensor_id: 7
                        flag_for: null
                        legacy_axis: z
                        description: Water temperature from the calibrated loggers
                        decoding:
                          missing_values: [-9999]
                      - id: 904
                        dataset_id: 123
                        name: temperature_qual
                        source_name: temp_qual
                        role: flag
                        dimensions: [time, depth]
                        unit: null
                        parameter_id: 27
                        sensor_id: null
                        flag_for: temperature
                        legacy_axis: z1
                        description: 1 where the temperature failed the quality checks
                        decoding: null
                    total: 4
                    limit: 100
                    offset: 0
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Variables]
      operationId: createVariable
      summary: Add a variable
      description: |
        Adds a variable to a dataset. Increases the dataset's `version`.

        A variable is described by what it is, not by a plot axis:

        - `role`: `time` or `coordinate` for the axes the data runs along, `data` for measured values, `flag` for quality flags.
        - `dimensions`: the names of the coordinate variables it runs along. A coordinate's only dimension is itself, e.g. `depth` has `["depth"]`. A data variable's dimensions must name existing `time` or `coordinate` variables of the same dataset.

        The inspect job suggests variables from a sample file.

        `legacy_axis` can't be sent: only the migration from the old system sets it (422).

        - **Drafts:** variables can be added as usual.
        - **Link datasets** can't have variables (422).

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreate"
            examples:
              data:
                summary: A data variable on time and depth
                value:
                  name: temperature
                  source_name: temp
                  role: data
                  dimensions: [time, depth]
                  unit: degC
                  parameter_id: 5
                  sensor_id: 7
                  description: Water temperature from the calibrated loggers
                  decoding:
                    missing_values: [-9999]
              time:
                summary: A time coordinate stored as unix seconds without CF units
                value:
                  name: time
                  source_name: time
                  role: time
                  dimensions: [time]
                  parameter_id: 1
                  decoding:
                    time_units: seconds since 1970-01-01 00:00:00
      responses:
        "201":
          description: The variable was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
              examples:
                temperature:
                  $ref: "#/components/examples/TemperatureVariable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The dataset already has a variable with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Dataset 123 already has a variable named temperature
                code: already_exists
        "422":
          description: The variable is invalid, e.g. its dimensions don't name coordinates of the dataset, it sets `legacy_axis`, or the dataset is a link dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknown_dimension:
                  summary: A dimension isn't a coordinate of the dataset
                  value:
                    detail: "Dimension 'depth' is not a time or coordinate variable of dataset 123"
                    code: validation_error
                    errors:
                      - loc: [body, dimensions, 1]
                        msg: Unknown dimension 'depth'
                legacy_axis:
                  summary: The body sets the read-only legacy_axis
                  value:
                    detail: legacy_axis is read-only
                    code: validation_error
                    errors:
                      - loc: [body, legacy_axis]
                        msg: Extra inputs are not permitted
                link_dataset:
                  summary: The dataset is a link dataset
                  value:
                    detail: Dataset 2 is a link dataset and can't have variables
                    code: link_dataset

  /datasets/{dataset_id}/variables/{variable_id}:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
      - $ref: "#/components/parameters/variable_id"
    patch:
      tags: [Variables]
      operationId: updateVariable
      summary: Update a variable
      description: |
        Only the fields sent are changed. Increases the dataset's `version`. Renaming a coordinate also renames it in the `dimensions` of the variables that use it.

        `legacy_axis` can't be changed (422). It stays the same when the variable is renamed, so old links keep pointing to it.

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdate"
            example:
              unit: degC
              sensor_id: 7
      responses:
        "200":
          description: The updated variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
              examples:
                temperature:
                  $ref: "#/components/examples/TemperatureVariable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another variable of the dataset already has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Dataset 123 already has a variable named temperature
                code: already_exists
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Variables]
      operationId: deleteVariable
      summary: Remove a variable
      description: |
        Removes a variable. Increases the dataset's `version`.

        A coordinate that other variables use as a dimension can't be removed until they're removed or changed.

        **Access:** user (own datasets) or owner.
      responses:
        "204":
          description: The variable was removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Other variables use this coordinate as a dimension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Variable 'depth' is a dimension of: temperature, temperature_qual"
                code: in_use

  # ---------------------------------------------------------------------------
  # Sites
  # ---------------------------------------------------------------------------
  /sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites
      description: |
        Lists sites, sorted by name.

        **Access:** public.
      parameters:
        - name: type
          in: query
          description: Only sites of this type (a value from the `site_types` vocabulary).
          schema:
            type: string
          example: lake
        - name: q
          in: query
          description: Text to search for in the name, case-insensitive.
          schema:
            type: string
          example: geneva
        - $ref: "#/components/parameters/bbox"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
              example:
                items:
                  - id: 1
                    name: Lake Geneva
                    type: lake
                    geometry:
                      type: Point
                      coordinates: [6.5, 46.45]
                    properties:
                      elevation_m: 372
                      max_depth_m: 309
                      morphology: true
                total: 1
                limit: 100
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a site
      description: |
        Creates a site. The ID is always assigned automatically.

        **Access:** user, because a new dataset may need a new site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
            examples:
              river:
                summary: A river station
                value:
                  name: Rhône at Porte du Scex
                  type: river
                  geometry:
                    type: Point
                    coordinates: [6.8893, 46.3489]
                  properties:
                    catchment_area_km2: 5244
      responses:
        "201":
          description: The site was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              example:
                id: 42
                name: Rhône at Porte du Scex
                type: river
                geometry:
                  type: Point
                  coordinates: [6.8893, 46.3489]
                properties:
                  catchment_area_km2: 5244
        "422":
          $ref: "#/components/responses/ValidationError"

  /sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/site_id"
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get a site
      description: |
        Returns a site. Its datasets are listed by `GET /datasets?site_id=`.

        **Access:** public.
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              examples:
                lake:
                  $ref: "#/components/examples/LakeSite"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sites]
      operationId: updateSite
      summary: Update a site
      description: |
        Only the fields sent are changed. `properties` is replaced as a whole. Increases the `version` of the site's datasets, since their metadata includes the site.

        **Access:** owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
            example:
              properties:
                elevation_m: 372
                max_depth_m: 309
                morphology: true
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              examples:
                lake:
                  $ref: "#/components/examples/LakeSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Sites]
      operationId: deleteSite
      summary: Delete a site
      description: |
        Deletes a site that no dataset or collection refers to.

        **Access:** owner
      responses:
        "204":
          description: The site was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Datasets or collections still refer to the site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Site 1 is used by 37 datasets and 1 collection
                code: in_use

  # ---------------------------------------------------------------------------
  # Collections
  # ---------------------------------------------------------------------------
  /collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections
      description: |
        Lists collections, sorted by name, with the number of published datasets in each.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of collections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPage"
              example:
                items:
                  - id: 1
                    slug: datalakes
                    name: Datalakes
                    description: Datasets collected and published by the Datalakes project.
                    link: https://www.eawag.ch/en/department/siam/projects/datalakes/
                    site_id: null
                    geometry: null
                    properties: {}
                    dataset_count: 54
                  - id: 2
                    slug: lexplore
                    name: LéXPLORE
                    description: Floating platform for research on Lake Geneva.
                    link: https://wp.unil.ch/lexplore/
                    site_id: 1
                    geometry:
                      type: Point
                      coordinates: [6.6588, 46.5004]
                    properties:
                      water_depth_m: 110
                      in_operation_since: 2019
                    dataset_count: 2
                total: 2
                limit: 100
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: |
        Creates a collection. Collections are one level deep: a collection can't contain other collections.

        **Access:** owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
            example:
              slug: lexplore
              name: LéXPLORE
              description: Floating platform for research on Lake Geneva.
              link: https://wp.unil.ch/lexplore/
              site_id: 1
              geometry:
                type: Point
                coordinates: [6.6588, 46.5004]
              properties:
                water_depth_m: 110
                in_operation_since: 2019
      responses:
        "201":
          description: The collection was created. It has no datasets yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
              example:
                id: 2
                slug: lexplore
                name: LéXPLORE
                description: Floating platform for research on Lake Geneva.
                link: https://wp.unil.ch/lexplore/
                site_id: 1
                geometry:
                  type: Point
                  coordinates: [6.6588, 46.5004]
                properties:
                  water_depth_m: 110
                  in_operation_since: 2019
                dataset_count: 0
                datasets: []
        "409":
          description: Another collection already has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: A collection with slug 'lexplore' already exists
                code: already_exists
        "422":
          $ref: "#/components/responses/ValidationError"

  /collections/{collection_id_or_slug}:
    parameters:
      - $ref: "#/components/parameters/collection_id_or_slug"
    get:
      tags: [Collections]
      operationId: getCollection
      summary: Get a collection with its datasets
      description: |
        Returns a collection and its published datasets. Drafts in the collection are left out. Link datasets are included.

        **Access:** public.
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
              examples:
                lexplore:
                  $ref: "#/components/examples/LexploreCollection"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: Update a collection
      description: |
        Only the fields sent are changed. `properties` is replaced as a whole. Changing the slug breaks links that use the old one.

        **Access:** owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
            example:
              description: Floating platform for research on Lake Geneva, 570 m off Pully, run by EPFL, Eawag, UNIL, UNIGE and CARRTEL. In operation since 2019.
      responses:
        "200":
          description: The updated collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
              examples:
                lexplore:
                  $ref: "#/components/examples/LexploreCollection"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another collection already has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: A collection with slug 'lexplore' already exists
                code: already_exists
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection
      description: |
        Deletes a collection. Its datasets are not deleted but stop belonging to it.

        **Access:** owner.
      responses:
        "204":
          description: The collection was deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collection_id}/datasets/{dataset_id}:
    parameters:
      - name: collection_id
        in: path
        required: true
        description: Collection ID.
        schema:
          type: integer
        example: 2
      - $ref: "#/components/parameters/dataset_id"
    put:
      tags: [Collections]
      operationId: addDatasetToCollection
      summary: Add a dataset to a collection
      description: |
        Adds a dataset to a collection. Adding a dataset that's already in the collection does nothing, so the request can be repeated safely. A dataset can be in several collections. Drafts and link datasets can be added too.

        **Access:** owner.
      responses:
        "204":
          description: The dataset is in the collection.
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Collections]
      operationId: removeDatasetFromCollection
      summary: Remove a dataset from a collection
      description: |
        Removes a dataset from a collection. The dataset itself is not deleted. Removing a dataset that isn't in the collection does nothing.

        **Access:** owner.
      responses:
        "204":
          description: The dataset is not in the collection.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Issues
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/issues:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Issues]
      operationId: listIssues
      summary: List a dataset's issues
      description: |
        Lists a dataset's issues, latest first: both problems with the data and events that explain it. With `start` and `end`, returns the issues that overlap that period. Issues without an `end` overlap any period after their `start`.

        - **Drafts:** their issues are returned like any other.
        - **Link datasets** have no issues, so the list is empty.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: category
          in: query
          description: Only problems, or only events.
          schema:
            $ref: "#/components/schemas/IssueCategory"
          example: problem
        - name: variable_id
          in: query
          description: Only issues on this variable, plus the dataset-wide issues (those without a variable), since they affect it too.
          schema:
            type: integer
          example: 903
        - name: state
          in: query
          description: Only problems in this state. Events have no state, so this filter leaves them out.
          schema:
            $ref: "#/components/schemas/IssueState"
          example: open
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
              example:
                items:
                  - id: 78
                    dataset_id: 123
                    category: event
                    variable_id: null
                    start: "2024-08-17T18:00:00Z"
                    end: "2024-08-17T22:00:00Z"
                    depth_min: null
                    depth_max: null
                    type: storm
                    description: Thunderstorm with gusts above 25 m/s that mixed the top 15 m.
                    reporter: John Doe
                    state: null
                    created_at: "2024-08-19T08:30:00Z"
                    updated_at: "2024-08-19T08:30:00Z"
                  - id: 77
                    dataset_id: 123
                    category: problem
                    variable_id: 903
                    start: "2024-06-12T08:00:00Z"
                    end: "2024-06-20T14:30:00Z"
                    depth_min: 2.0
                    depth_max: 3.0
                    type: sensor_fault
                    description: Logger at 2.5 m flooded, with values stuck at 4.2 °C until it was replaced.
                    reporter: John Doe
                    state: resolved
                    created_at: "2024-06-14T10:02:00Z"
                    updated_at: "2024-06-20T15:10:00Z"
                  - id: 76
                    dataset_id: 123
                    category: problem
                    variable_id: null
                    start: "2024-04-02T07:00:00Z"
                    end: "2024-04-02T11:30:00Z"
                    depth_min: null
                    depth_max: null
                    type: maintenance
                    description: Chain lifted for cleaning, affecting all depths.
                    reporter: John Doe
                    state: resolved
                    created_at: "2024-04-02T12:05:00Z"
                    updated_at: "2024-04-02T12:05:00Z"
                total: 3
                limit: 100
                offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Issues]
      operationId: createIssue
      summary: Report an issue
      description: |
        Reports something that affected a dataset's data during a period. Increases the dataset's `version`.

        - A **problem** (`category: problem`, the default) means the data is wrong or unreliable: maintenance, a sensor fault, a calibration… It has a `state`, and `mask=true` on the data endpoint hides the values it covers.
        - An **event** (`category: event`) explains data that is correct: a storm, ice cover… It has no `state` and is never masked.

        For both:

        - Without `variable_id`, the issue affects the whole dataset.
        - Without `depth_min`/`depth_max`, it affects all depths.
        - Without `end`, it's still going on.

        The data is not changed: issues are returned alongside it.

        - **Drafts:** issues can be reported as usual.
        - **Link datasets** can't have issues (422).

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreate"
            examples:
              problem:
                summary: A sensor fault at one depth
                value:
                  category: problem
                  variable_id: 903
                  start: "2024-06-12T08:00:00Z"
                  end: "2024-06-20T14:30:00Z"
                  depth_min: 2.0
                  depth_max: 3.0
                  type: sensor_fault
                  description: Logger at 2.5 m flooded, with values stuck at 4.2 °C until it was replaced.
                  reporter: John Doe
                  state: resolved
              event:
                summary: A storm
                value:
                  category: event
                  start: "2024-08-17T18:00:00Z"
                  end: "2024-08-17T22:00:00Z"
                  type: storm
                  description: Thunderstorm with gusts above 25 m/s that mixed the top 15 m.
                  reporter: John Doe
      responses:
        "201":
          description: The issue was reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
              examples:
                depth_limited:
                  $ref: "#/components/examples/DepthLimitedIssue"
                storm:
                  $ref: "#/components/examples/StormIssue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The issue is invalid, e.g. the variable belongs to another dataset, an event has a `state`, or the dataset is a link dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                other_variable:
                  summary: The variable belongs to another dataset
                  value:
                    detail: Variable 450 is not a variable of dataset 123
                    code: unknown_reference
                    errors:
                      - loc: [body, variable_id]
                        msg: Not a variable of dataset 123
                event_state:
                  summary: An event with a state
                  value:
                    detail: Events have no state
                    code: validation_error
                    errors:
                      - loc: [body, state]
                        msg: Must be null for events
                link_dataset:
                  summary: The dataset is a link dataset
                  value:
                    detail: Dataset 2 is a link dataset and can't have issues
                    code: link_dataset

  /issues/{issue_id}:
    parameters:
      - $ref: "#/components/parameters/issue_id"
    patch:
      tags: [Issues]
      operationId: updateIssue
      summary: Update an issue
      description: |
        Only the fields sent are changed, e.g. `end` and `state` once a fault is fixed. Increases the dataset's `version`.

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
            example:
              end: "2024-06-20T14:30:00Z"
              state: resolved
      responses:
        "200":
          description: The updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
              examples:
                depth_limited:
                  $ref: "#/components/examples/DepthLimitedIssue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Issues]
      operationId: deleteIssue
      summary: Delete an issue
      description: |
        Deletes an issue, e.g. one reported by mistake. Increases the dataset's `version`. To close a problem, set its `state` to `resolved` instead.

        **Access:** user (own datasets) or owner.
      responses:
        "204":
          description: The issue was deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Vocabularies
  # ---------------------------------------------------------------------------
  /vocabularies:
    get:
      tags: [Vocabularies]
      operationId: listVocabularies
      summary: List the vocabularies
      description: |
        Lists the vocabularies, with the number of entries in each. The entries themselves are listed by `GET /vocabularies/{vocabulary_name}`.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of vocabularies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyPage"
              example:
                items:
                  - name: parameters
                    description: Physical or chemical quantities that variables measure, e.g. water temperature.
                    fixed: false
                    entry_count: 118
                    url: /vocabularies/parameters
                  - name: organisations
                    description: Organisations that datasets belong to.
                    fixed: false
                    entry_count: 2
                    url: /vocabularies/organisations
                  - name: persons
                    description: Contact persons of datasets. Emails are left out.
                    fixed: false
                    entry_count: 1
                    url: /vocabularies/persons
                  - name: sensors
                    description: Sensors that variables are measured with.
                    fixed: false
                    entry_count: 16
                    url: /vocabularies/sensors
                  - name: licenses
                    description: Licenses that datasets are published under.
                    fixed: false
                    entry_count: 1
                    url: /vocabularies/licenses
                  - name: site_types
                    description: Kinds of sites, e.g. lake or river.
                    fixed: false
                    entry_count: 3
                    url: /vocabularies/site_types
                  - name: feature_types
                    description: Shapes of a dataset's data.
                    fixed: true
                    entry_count: 3
                    url: /vocabularies/feature_types
                  - name: variable_roles
                    description: Roles of a dataset's variables.
                    fixed: true
                    entry_count: 4
                    url: /vocabularies/variable_roles
                total: 8
                limit: 100
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationError"

  /vocabularies/{vocabulary_name}:
    parameters:
      - $ref: "#/components/parameters/vocabulary_name"
    get:
      tags: [Vocabularies]
      operationId: listVocabularyEntries
      summary: List one vocabulary
      description: |
        Lists the entries of one vocabulary, sorted by name.

        **Access:** public.
      parameters:
        - name: q
          in: query
          description: Text to search for in the name, case-insensitive.
          schema:
            type: string
          example: temperature
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of entries. Their shape depends on the vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyEntryPage"
              example:
                items:
                  - id: 5
                    name: Water temperature
                    cf_name: water_temperature
                    description: In situ temperature of the water. Use a vertical coordinate variable to give the depth at which it applies.
                    unit: degC
                    characteristic: Physical
                    name_de: Wassertemperatur
                    name_fr: Température de l'eau
                    name_it: Temperatura dell'acqua
                total: 1
                limit: 100
                offset: 0
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Vocabularies]
      operationId: createVocabularyEntry
      summary: Add an entry to a vocabulary
      description: |
        Adds an entry to a vocabulary. The body depends on the vocabulary, e.g. a parameter or a sensor.

        `feature_types` and `variable_roles` are fixed, because the API depends on their values: adding to them returns 422.

        **Access:** user, because a new dataset may need a new sensor or person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyEntryCreate"
            examples:
              sensor:
                summary: A sensor
                value:
                  name: RBR Solo-T
                  manufacturer: RBR
                  accuracy: "0.002 °C"
                  link: https://rbr-global.com/products/standard-loggers/rbrsolo-t/
              site_type:
                summary: A site type
                value:
                  name: reservoir
                  description: An artificial lake behind a dam.
      responses:
        "201":
          description: The entry was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyEntry"
              example:
                id: 17
                name: RBR Solo-T
                manufacturer: RBR
                accuracy: "0.002 °C"
                link: https://rbr-global.com/products/standard-loggers/rbrsolo-t/
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The vocabulary already has an entry with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: The sensors vocabulary already has an entry named 'RBR Solo-T'
                code: already_exists
        "422":
          description: The entry is invalid, or the vocabulary is fixed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: The feature_types vocabulary is fixed
                code: vocabulary_fixed

  # ---------------------------------------------------------------------------
  # Sources
  # ---------------------------------------------------------------------------
  /source-types:
    get:
      tags: [Sources]
      operationId: listSourceTypes
      summary: List the supported source types
      description: |
        Lists the backends a source can use, with the options each one accepts, so a form can be built from them. Only these options are accepted, and anything else is rejected with 422.

        Sources are always read anonymously. No backend has an option for access keys, passwords or tokens, and none will be added.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The supported source types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceTypePage"
              example:
                items:
                  - backend: s3
                    name: S3 bucket
                    description: A public bucket on Amazon S3 or an S3-compatible store. The bucket must allow anonymous reads.
                    path_description: Prefix inside the bucket, e.g. `thermistorchain/Level2`. Empty for the whole bucket.
                    options:
                      - name: bucket
                        type: string
                        required: true
                        description: Name of the bucket.
                        example: eawag-lexplore
                      - name: region
                        type: string
                        required: false
                        description: Region of the bucket, for Amazon S3.
                        example: eu-central-1
                      - name: endpoint
                        type: string
                        required: false
                        description: URL of an S3-compatible store. Leave it out for Amazon S3. Must be a public HTTPS address.
                        example: https://s3.example.org
                  - backend: switchdrive
                    name: SWITCHdrive public share
                    description: A folder shared by public link on SWITCHdrive. The share must not have a password, and should only contain the dataset's files, since anyone with the link can read all of it.
                    path_description: Folder inside the share, e.g. `Level2`. Empty for the whole share.
                    options:
                      - name: share_url
                        type: string
                        required: true
                        description: The public link of the share. Only the share token in it is stored.
                        example: https://drive.switch.ch/index.php/s/aB3dE5fG7hJ9kL1
                total: 2
                limit: 100
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationError"

  /sources/test:
    post:
      tags: [Sources]
      operationId: testSource
      summary: Test a source without saving it
      description: |
        Tries to list a source anonymously and returns the first files it finds, so a form can show whether the source works before it's saved.

        The response is 200 whether or not the source could be read: check `ok`. An invalid config, such as one with credentials, is rejected with 422 before anything is tried.

        The source is listed in the API with a 10 s timeout.

        **Access:** user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
            examples:
              s3:
                $ref: "#/components/examples/S3SourceInput"
              switchdrive:
                $ref: "#/components/examples/SwitchdriveSourceInput"
              credentials:
                summary: A config with credentials (rejected with 422)
                value:
                  backend: s3
                  options:
                    bucket: eawag-lexplore
                    region: eu-central-1
                    access_key_id: AKIAIOSFODNN7EXAMPLE
                  path: thermistorchain/Level2
      responses:
        "200":
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceTestResult"
              examples:
                ok:
                  summary: The source can be read
                  value:
                    ok: true
                    error: null
                    files:
                      - path: L2_ThermistorChain_202405.nc
                        is_dir: false
                        size: 18342011
                        modified_at: "2024-06-01T00:12:40Z"
                        included: true
                      - path: L2_ThermistorChain_202406.nc
                        is_dir: false
                        size: 17920455
                        modified_at: "2024-07-01T00:12:38Z"
                        included: true
                      - path: README.md
                        is_dir: false
                        size: 2104
                        modified_at: "2023-01-10T08:00:00Z"
                        included: false
                    truncated: false
                not_public:
                  summary: The bucket doesn't allow anonymous reads
                  value:
                    ok: false
                    error:
                      detail: Access denied to bucket eawag-lexplore. Sources are read anonymously, so the bucket must allow public reads.
                      code: source_not_public
                    files: []
                    truncated: false
                missing:
                  summary: The bucket doesn't exist
                  value:
                    ok: false
                    error:
                      detail: Bucket eawag-lexplor does not exist
                      code: source_not_found
                    files: []
                    truncated: false
        "422":
          $ref: "#/components/responses/SourceValidationError"

  /datasets/{dataset_id}/source:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get a dataset's source
      description: |
        Returns where the dataset's files come from.

        - **Drafts** have sources like any other dataset.
        - **Link datasets** never have a source (404).

        **Access:** public.
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
              examples:
                s3:
                  $ref: "#/components/examples/S3Source"
                switchdrive:
                  $ref: "#/components/examples/SwitchdriveSource"
        "404":
          description: The dataset doesn't exist, or has no source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_dataset:
                  summary: The dataset doesn't exist
                  value:
                    detail: Dataset 999 not found
                    code: not_found
                no_source:
                  summary: The dataset has no source
                  value:
                    detail: Dataset 512 has no source
                    code: no_source
    put:
      tags: [Sources]
      operationId: setSource
      summary: Set or replace a dataset's source
      description: |
        Sets the dataset's source, replacing the current one. A dataset has one source. Nothing is downloaded yet: start a sync for that.

        The source is tested first, like `POST /sources/test`. It's only saved if it can be read anonymously.

        Replacing a source keeps the files already synced: they're the dataset's archive. The next sync adds the files of the new source. Increases the dataset's `version`.

        - **Drafts:** a source can be set as usual.
        - **Link datasets** can't have a source (422).

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
            examples:
              s3:
                $ref: "#/components/examples/S3SourceInput"
              switchdrive:
                $ref: "#/components/examples/SwitchdriveSourceInput"
      responses:
        "200":
          description: The source was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
              examples:
                s3:
                  $ref: "#/components/examples/S3Source"
        "201":
          description: The dataset had no source and now has one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
              examples:
                switchdrive:
                  $ref: "#/components/examples/SwitchdriveSource"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The config is invalid (e.g. it contains credentials), the source can't be read anonymously, or the dataset is a link dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                credentials:
                  $ref: "#/components/examples/CredentialsRejected"
                unknown_option:
                  $ref: "#/components/examples/UnknownOptionRejected"
                not_public:
                  summary: The source can't be read anonymously
                  value:
                    detail: Access denied to bucket eawag-lexplore. Sources are read anonymously, so the bucket must allow public reads.
                    code: source_not_public
                link_dataset:
                  summary: The dataset is a link dataset
                  value:
                    detail: Dataset 2 is a link dataset and can't have a source
                    code: link_dataset
    delete:
      tags: [Sources]
      operationId: deleteSource
      summary: Remove a dataset's source
      description: |
        Removes the source. The files already synced and the data built from them are kept, and the dataset just stops syncing. Increases the dataset's `version`.

        **Access:** user (own datasets) or owner.
      responses:
        "204":
          description: The source was removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /datasets/{dataset_id}/source/files:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Sources]
      operationId: listSourceFiles
      summary: Browse a dataset's source
      description: |
        Lists the files and folders in the dataset's source, live, for a file browser. `included` tells whether the source's `include` patterns select each file.

        This shows what's in the source now. The files already synced are in the file index (`GET /datasets/{dataset_id}/files`).

        Entries are sorted by path and paginated like other lists. The source is listed in the API with a 10 s timeout and at most 10 000 entries. When the folder has more, `truncated` is `true` and the rest can't be reached, so a subfolder has to be browsed instead.

        **Access:** public.
      parameters:
        - name: path
          in: query
          description: Folder to list, relative to the source's `path`. Empty for the top.
          schema:
            type: string
            default: ""
          example: "2024"
        - name: recursive
          in: query
          description: Also list the contents of subfolders.
          schema:
            type: boolean
            default: false
          example: false
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of the folder's contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceEntryPage"
              example:
                path: ""
                items:
                  - path: "2023"
                    is_dir: true
                    size: null
                    modified_at: null
                    included: true
                  - path: "2024"
                    is_dir: true
                    size: null
                    modified_at: null
                    included: true
                  - path: README.md
                    is_dir: false
                    size: 2104
                    modified_at: "2023-01-10T08:00:00Z"
                    included: false
                total: 3
                limit: 100
                offset: 0
                truncated: false
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The dataset has no source, or the folder is outside it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_source:
                  summary: The dataset has no source
                  value:
                    detail: Dataset 512 has no source
                    code: no_source
                outside:
                  summary: The path leaves the source
                  value:
                    detail: "Path '../other-dataset' is outside the source"
                    code: validation_error
                    errors:
                      - loc: [query, path]
                        msg: Must stay inside the source
        "502":
          description: The source couldn't be read, e.g. the bucket was made private or the listing timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Listing the source took longer than 10 s
                code: source_timeout

  # ---------------------------------------------------------------------------
  # Sync
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/inspect:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    post:
      tags: [Sync]
      operationId: inspectFile
      summary: Suggest variables from a sample file
      description: |
        Queues a job that downloads one file from the source, reads it, and suggests the dataset's variables and feature type. The job's `result` holds the suggestions.

        The suggestions are not saved. Review them, then create the variables with `POST /datasets/{dataset_id}/variables`. Inspect also points out what needs checking: times without CF units, missing values such as `-9999`, and a location given only in the global attributes.

        - **Drafts:** inspect works as usual, and is meant for setting up a new dataset.
        - **Link datasets** have no source (422).

        **Access:** user (own datasets) or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectRequest"
            example:
              file: 2024/L2_ThermistorChain_202406.nc
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The dataset has no source, or the file isn't in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_source:
                  summary: The dataset has no source
                  value:
                    detail: Dataset 512 has no source
                    code: no_source
                outside:
                  summary: The file is outside the source
                  value:
                    detail: "Path '../other-dataset/file.nc' is outside the source"
                    code: validation_error
                    errors:
                      - loc: [body, file]
                        msg: Must stay inside the source

  /datasets/{dataset_id}/sync:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    post:
      tags: [Sync]
      operationId: syncDataset
      summary: Sync a dataset from its source
      description: |
        Queues a sync and returns the job. The worker then:

        1. Copies new and changed files from the source into the dataset's archive.
        2. Updates the file index (`GET /datasets/{dataset_id}/files`), marking those files `new`.
        3. Processes the new files into the dataset's data, and increases its `version` if anything changed.

        A file that can't be processed is marked `failed` in the file index with its error. The other files are still processed, and the job ends as `failed` so the problem is noticed.

        **External callers**, such as a processing pipeline, call this endpoint after uploading new data to the source. Some datasets update every 20 minutes, so a sync with nothing new is cheap. External callers use the dataset's sync token.

        Only one sync per dataset runs at a time. If one is already queued or running, this returns 409 with the job's ID. A queued sync will pick up the new files anyway.

        - **Drafts** sync as usual.
        - **Link datasets** have no source (422).

        **Access:** user (own datasets) or owner, or the dataset's sync token.
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The dataset has no source, e.g. it's a link dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_source:
                  summary: The dataset has no source
                  value:
                    detail: Dataset 512 has no source
                    code: no_source
                link_dataset:
                  summary: The dataset is a link dataset
                  value:
                    detail: Dataset 2 is a link dataset and can't be synced
                    code: link_dataset

  /datasets/{dataset_id}/status:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Sync]
      operationId: getDatasetStatus
      summary: Check whether a live dataset is up to date
      description: |
        Tells whether a live dataset is overdue: its latest data is older than `update_interval` seconds. Used by uptime monitoring.

        Datasets without an `update_interval` aren't live, so they're never overdue. This includes link datasets.

        **Access:** public.
      responses:
        "200":
          description: The dataset's freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetStatus"
              examples:
                fresh:
                  summary: Up to date
                  value:
                    dataset_id: 123
                    live: true
                    update_interval: 3600
                    latest_data_at: "2024-10-30T09:50:00Z"
                    overdue: false
                    overdue_since: null
                    last_sync:
                      job_id: 5812
                      status: succeeded
                      finished_at: "2024-10-30T10:04:12Z"
                    checked_at: "2024-10-30T10:15:00Z"
                overdue:
                  summary: Overdue since the last sync failed
                  value:
                    dataset_id: 123
                    live: true
                    update_interval: 3600
                    latest_data_at: "2024-10-29T23:50:00Z"
                    overdue: true
                    overdue_since: "2024-10-30T00:50:00Z"
                    last_sync:
                      job_id: 5790
                      status: failed
                      finished_at: "2024-10-30T00:05:31Z"
                    checked_at: "2024-10-30T10:15:00Z"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Jobs
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/jobs:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Jobs]
      operationId: listDatasetJobs
      summary: List a dataset's jobs
      description: |
        Lists the jobs of one dataset, newest first: what was synced, inspected or rebuilt, and what failed.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/job_status"
        - $ref: "#/components/parameters/job_type"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
              example:
                items:
                  - id: 5812
                    dataset_id: 123
                    type: sync
                    status: queued
                    progress: null
                    error: null
                    log: ""
                    result: null
                    created_at: "2024-10-30T10:20:00Z"
                    started_at: null
                    finished_at: null
                    url: /jobs/5812
                total: 1
                limit: 100
                offset: 0
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List all jobs
      description: |
        Lists the jobs of all datasets, newest first, e.g. to see what's queued or what failed overnight.

        **Access:** owner.
      parameters:
        - $ref: "#/components/parameters/job_status"
        - $ref: "#/components/parameters/job_type"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
              example:
                items:
                  - id: 5790
                    dataset_id: 123
                    type: sync
                    status: failed
                    progress: 1
                    error: "1 of 3 new files failed: L2_ThermistorChain_202410.nc: variable 'temp' not found"
                    log: "Copied 3 files (52.1 MB)\nProcessing L2_ThermistorChain_202410.nc failed: variable 'temp' not found"
                    result:
                      files_new: 3
                      files_changed: 0
                      files_unchanged: 64
                      bytes_copied: 54632118
                      files_processed: 2
                      files_failed:
                        - path: 2024/L2_ThermistorChain_202410.nc
                          error: "variable 'temp' not found"
                    created_at: "2024-10-30T00:00:02Z"
                    started_at: "2024-10-30T00:00:03Z"
                    finished_at: "2024-10-30T00:05:31Z"
                    url: /jobs/5790
                total: 1
                limit: 100
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationError"

  /jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/job_id"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      description: |
        Returns a job's status, progress, error, the last lines of its log, and its result. Poll this after starting a sync or an inspect.

        **Access:** public.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                queued_sync:
                  $ref: "#/components/examples/QueuedSyncJob"
                failed_sync:
                  $ref: "#/components/examples/FailedSyncJob"
                finished_inspect:
                  $ref: "#/components/examples/FinishedInspectJob"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/job_id"
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a job
      description: |
        Cancels a queued or running job. A queued job is cancelled at once. A running job stops at the next safe point, so its status can stay `running` for a moment. Work already done is kept: files already copied stay in the archive.

        **Access:** user (jobs of own datasets) or owner.
      responses:
        "200":
          description: The job, cancelled or stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              example:
                id: 5812
                dataset_id: 123
                type: sync
                status: cancelled
                progress: null
                error: null
                log: Cancelled before it started
                result: null
                created_at: "2024-10-30T10:20:00Z"
                started_at: null
                finished_at: "2024-10-30T10:21:05Z"
                url: /jobs/5812
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job has already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Job 5790 already ended (failed)
                code: job_finished

  # ---------------------------------------------------------------------------
  # Files
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/files:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Files]
      operationId: listFiles
      summary: List a dataset's file index
      description: |
        Lists every file synced from the dataset's source, sorted by path, with its size, the time range it covers, and whether it was processed.

        With `start` and `end`, returns the files whose time range overlaps that period. Files not processed yet have no time range, so this filter leaves them out.

        - **Drafts:** their files are listed like any other.
        - **Link datasets** have no files, so the list is empty.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: status
          in: query
          description: Only files with this status.
          schema:
            $ref: "#/components/schemas/FileStatus"
          example: failed
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
              example:
                items:
                  - id: 20411
                    dataset_id: 123
                    path: 2024/L2_ThermistorChain_202409.nc
                    size: 18011342
                    modified_at: "2024-10-01T00:12:41Z"
                    hash: 9b2f0c4e8d1a7f3b6c5e2d0a1b9c8d7e
                    time_start: "2024-09-01T00:00:00Z"
                    time_end: "2024-09-30T23:50:00Z"
                    status: ok
                    error: null
                  - id: 20412
                    dataset_id: 123
                    path: 2024/L2_ThermistorChain_202410.nc
                    size: 17388120
                    modified_at: "2024-10-30T00:00:01Z"
                    hash: 1c7e9a2b4d6f8e0a3b5c7d9e1f2a4b6c
                    time_start: null
                    time_end: null
                    status: failed
                    error: "variable 'temp' not found"
                total: 2
                limit: 100
                offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/data:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Data]
      operationId: getData
      summary: Read data
      description: |
        Returns a dataset's values for a time range, a depth range and a set of variables. The dataset's `version` is in the body and in the `ETag` header.

        **The shape depends on the feature type:**

        - `timeSeries`: variables have the dimension `time`.
        - `timeSeriesProfile`: variables have the dimensions `time` and `depth`.
        - `profile`: every cast in the time range. Casts have their own depths, so variables have the dimensions `profile` and `level`. `depth` is a coordinate on both, and shorter casts are padded with `null`. List the casts with `GET /datasets/{dataset_id}/profiles`.

        **Issues and flags**: values are returned as stored, and the issues that overlap the request are listed in `issues`. Flag variables are returned when they're requested, like any variable. With `mask=true`, values covered by a problem (an issue with `category: problem`) or flagged as bad are replaced by `null`. Events never mask values.

        **Plotting:** `resample` averages values over fixed steps, e.g. `1D`. `max_points` picks the smallest step from a fixed list (`10min`, `30min`, `1h`, `3h`, `6h`, `12h`, `1D`, `1W`, `1M`) that keeps the number of time steps under the limit. The step used is in `query.resample`.

        **Formats:** JSON by default. `format=csv` returns one row per time (and depth), `format=netcdf` a NetCDF4 file with CF attributes.

        **Size:** responses above about a certain size are refused with 413, pointing to `POST /exports` with the same query. A time range without data returns empty arrays.

        - **Drafts:** their data can be read like any other.
        - **Link datasets** have no data here (404 with code `link_dataset`). Their data is at their `external_url`.

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/variables"
        - $ref: "#/components/parameters/data_start"
        - $ref: "#/components/parameters/data_end"
        - $ref: "#/components/parameters/depth_min"
        - $ref: "#/components/parameters/depth_max"
        - $ref: "#/components/parameters/resample"
        - $ref: "#/components/parameters/max_points"
        - $ref: "#/components/parameters/mask"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/if_none_match"
      responses:
        "200":
          description: The data.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
              examples:
                timeSeries:
                  $ref: "#/components/examples/TimeSeriesData"
                timeSeriesProfile:
                  $ref: "#/components/examples/TimeSeriesProfileData"
                profile:
                  $ref: "#/components/examples/ProfileData"
            text/csv:
              schema:
                type: string
              example: |
                time,depth (m),temperature (degC)
                2024-03-01T00:00:00Z,0.5,6.1
                2024-03-01T00:00:00Z,1.0,6.0
                2024-03-01T00:00:00Z,1.5,5.9
                2024-03-01T00:10:00Z,0.5,6.1
                2024-03-01T00:10:00Z,1.0,6.0
                2024-03-01T00:10:00Z,1.5,
            application/x-netcdf:
              schema:
                type: string
                contentMediaType: application/x-netcdf
                description: A NetCDF4 file with the same coordinates, variables and units as the JSON, and the dataset's metadata as global attributes.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: The request makes no sense for this dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                time_range:
                  summary: start is after end
                  value:
                    detail: "start (2024-03-31) is after end (2024-03-01)"
                    code: invalid_time_range
                unknown_variable:
                  summary: A variable the dataset doesn't have
                  value:
                    detail: "Dataset 123 has no variable 'salinity'. Variables: temperature, temperature_qual"
                    code: unknown_variable
                no_depth:
                  summary: A depth filter on a dataset without depth
                  value:
                    detail: Dataset 124 has no depth coordinate, so depth_min and depth_max can't be used
                    code: no_depth
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

  /datasets/{dataset_id}/latest:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Data]
      operationId: getLatest
      summary: Get the latest values
      description: |
        Returns the latest valid value of each variable, with its time. For a variable with depth, it's the latest time step with any valid value, with the values at each depth (`null` where that depth had none). For profile datasets, it's the latest cast.

        Values are never masked here: a value covered by an open problem is still returned, and the issue is listed in `issues`.

        - **Drafts:** work like any other dataset.
        - **Link datasets** have no data here (404 with code `link_dataset`).

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/variables"
        - $ref: "#/components/parameters/if_none_match"
      responses:
        "200":
          description: The latest values.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
              examples:
                timeSeriesProfile:
                  summary: The latest temperature profile of a thermistor chain
                  value:
                    dataset_id: 123
                    version: 14
                    feature_type: timeSeriesProfile
                    variables:
                      temperature:
                        parameter: Water temperature
                        unit: degC
                        time: "2024-10-29T23:50:00Z"
                        coordinates:
                          depth:
                            unit: m
                            values: [0.5, 1.0, 1.5]
                        values: [14.2, 14.2, null]
                    issues: []
                timeSeries:
                  summary: The latest values of a weather station
                  value:
                    dataset_id: 124
                    version: 2203
                    feature_type: timeSeries
                    variables:
                      air_temperature:
                        parameter: Air Temperature
                        unit: degC
                        time: "2024-10-30T09:50:00Z"
                        coordinates: {}
                        values: 11.4
                      wind_speed:
                        parameter: Wind Speed
                        unit: m/s
                        time: "2024-10-30T09:40:00Z"
                        coordinates: {}
                        values: 3.2
                    issues: []
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: A variable the dataset doesn't have.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Dataset 123 has no variable 'salinity'. Variables: temperature, temperature_qual"
                code: unknown_variable
        "404":
          $ref: "#/components/responses/NoData"

  /datasets/{dataset_id}/profiles:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Data]
      operationId: listProfiles
      summary: List the casts of a profile dataset
      description: |
        Lists the casts of a `profile` dataset, oldest first, with each cast's time, position and depth range. `data_url` fetches one cast from the data endpoint.

        Other feature types have no casts (400).

        - **Drafts:** work like any other dataset.
        - **Link datasets** have no data here (404 with code `link_dataset`).

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/if_none_match"
      responses:
        "200":
          description: A page of casts.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
              example:
                items:
                  - time: "2024-05-14T08:32:00Z"
                    latitude: 46.4525
                    longitude: 6.5890
                    depth_min: 0.5
                    depth_max: 305.0
                    levels: 610
                    data_url: /datasets/512/data?start=2024-05-14T08:32:00Z&end=2024-05-14T08:32:00Z
                  - time: "2024-06-11T09:05:00Z"
                    latitude: 46.4526
                    longitude: 6.5891
                    depth_min: 0.5
                    depth_max: 302.5
                    levels: 605
                    data_url: /datasets/512/data?start=2024-06-11T09:05:00Z&end=2024-06-11T09:05:00Z
                total: 2
                limit: 100
                offset: 0
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: The dataset isn't a profile dataset, or `start` is after `end`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_profile:
                  summary: Not a profile dataset
                  value:
                    detail: Dataset 123 is a timeSeriesProfile dataset and has no casts. Use the data endpoint.
                    code: not_profile_dataset
                time_range:
                  summary: start is after end
                  value:
                    detail: "start (2024-03-31) is after end (2024-03-01)"
                    code: invalid_time_range
        "404":
          $ref: "#/components/responses/NoData"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # Availability
  # ---------------------------------------------------------------------------
  /datasets/{dataset_id}/availability:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    get:
      tags: [Availability]
      operationId: getAvailability
      summary: When a dataset has data
      description: |
        Returns, per variable, when the dataset has valid data. It's computed while the data is built, so it answers without reading the data.

        - `resolution=raw`: the periods with valid data, as intervals. Gaps shorter than the dataset's gap threshold are merged, so a few missing values don't split an interval.
        - `resolution=day`, `month` or `year`: for each period, the share of it covered by those intervals, from 0 to 1. Periods without data are left out. Use this for long timelines.

        Issues, problems and events alike, don't count as gaps. The issues that overlap the request are listed in `issues`, so they can be drawn on the timeline.

        - **Drafts:** work like any other dataset.
        - **Link datasets** have no data here (404 with code `link_dataset`).

        **Access:** public.
      parameters:
        - $ref: "#/components/parameters/variables"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: resolution
          in: query
          description: Raw intervals, or the share of each day, month or year with data.
          schema:
            type: string
            enum: [raw, day, month, year]
            default: raw
          example: month
        - $ref: "#/components/parameters/if_none_match"
      responses:
        "200":
          description: The availability.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
              examples:
                raw:
                  summary: Raw intervals
                  value:
                    dataset_id: 123
                    version: 14
                    resolution: raw
                    variables:
                      temperature:
                        intervals:
                          - start: "2019-03-07T00:00:00Z"
                            end: "2021-07-14T09:20:00Z"
                            valid_count: 3801312
                          - start: "2021-08-02T11:00:00Z"
                            end: "2024-10-29T23:50:00Z"
                            valid_count: 5372160
                        periods: null
                    issues:
                      - id: 77
                        category: problem
                        variable: temperature
                        start: "2024-06-12T08:00:00Z"
                        end: "2024-06-20T14:30:00Z"
                        depth_min: 2.0
                        depth_max: 3.0
                        type: sensor_fault
                        state: resolved
                month:
                  summary: Share of each month with data
                  value:
                    dataset_id: 123
                    version: 14
                    resolution: month
                    variables:
                      temperature:
                        intervals: null
                        periods:
                          - start: "2021-06-01T00:00:00Z"
                            fraction: 1.0
                          - start: "2021-07-01T00:00:00Z"
                            fraction: 0.43
                          - start: "2021-08-01T00:00:00Z"
                            fraction: 0.97
                    issues: []
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: A variable the dataset doesn't have, or `start` is after `end`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Dataset 123 has no variable 'salinity'. Variables: temperature, temperature_qual"
                code: unknown_variable
        "404":
          $ref: "#/components/responses/NoData"
        "422":
          $ref: "#/components/responses/ValidationError"

  /availability:
    get:
      tags: [Availability]
      operationId: searchAvailability
      summary: Which datasets have data in a period and area
      description: |
        Lists the published datasets with valid data between `start` and `end`, most complete first, with the share of the period they cover. Combine with `bbox`, `site_id` and `parameter` to answer questions such as "which datasets measured water temperature in Lake Geneva in 2023?".

        Drafts and link datasets are left out: drafts aren't listed, and link datasets have no data here.

        **Access:** public.
      parameters:
        - name: start
          in: query
          required: true
          description: Start of the period, inclusive. A date or a full ISO 8601 timestamp.
          schema:
            type: string
          example: "2023-01-01"
        - name: end
          in: query
          required: true
          description: End of the period, inclusive. A date (the whole day) or a full ISO 8601 timestamp.
          schema:
            type: string
          example: "2023-12-31"
        - $ref: "#/components/parameters/bbox"
        - name: site_id
          in: query
          description: Only datasets at this site.
          schema:
            type: integer
          example: 1
        - name: parameter
          in: query
          description: Only datasets measuring this parameter, and only the variables measuring it count towards `fraction`.
          schema:
            type: integer
          example: 5
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of datasets with data in the period.
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetAvailabilityPage"
              example:
                items:
                  - dataset_id: 123
                    title: LéXPLORE thermistor chain
                    feature_type: timeSeriesProfile
                    site_id: 1
                    latitude: 46.5004
                    longitude: 6.6588
                    first: "2023-01-01T00:00:00Z"
                    last: "2023-12-31T23:50:00Z"
                    fraction: 0.98
                  - dataset_id: 512
                    title: Lake Geneva CTD casts at SHL2
                    feature_type: profile
                    site_id: 1
                    latitude: 46.4525
                    longitude: 6.5890
                    first: "2023-01-17T08:40:00Z"
                    last: "2023-12-12T09:15:00Z"
                    fraction: 0.002
                total: 2
                limit: 100
                offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # Exports
  # ---------------------------------------------------------------------------
  /exports/estimate:
    post:
      tags: [Exports]
      operationId: estimateExport
      summary: Estimate the size of an export
      description: |
        Estimates how large an export would be, without creating it, so the size can be shown before downloading. The estimate is meant to be within a factor of 2 of the real size. `existing` tells whether an identical export is already ready.

        **Access:** public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
            examples:
              five_years:
                $ref: "#/components/examples/FiveYearExportRequest"
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportEstimate"
              example:
                size: 734003200
                values: 91238400
                existing: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "422":
          $ref: "#/components/responses/ValidationError"

  /exports:
    post:
      tags: [Exports]
      operationId: createExport
      summary: Create an export
      description: |
        Prepares a file with a subset of a dataset, in the background, for downloads too large for the data endpoint. It takes the same query as the data endpoint, plus a `format`: NetCDF or CSV. The file is zipped with a README holding the dataset's metadata, citation, license and variables.

        The export's ID is a hash of the dataset, its `version` and the query. An identical request therefore returns the same export: 200 if it's ready, 202 if it's still being prepared. Once the dataset's data changes, the same query creates a new export.

        Poll `GET /exports/{export_id}` until `status` is `ready`, then download it. Exports are deleted 7 days after they're ready, or earlier, oldest first, when exports use more than their disk budget.

        **Access:** public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
            examples:
              five_years:
                $ref: "#/components/examples/FiveYearExportRequest"
      responses:
        "200":
          description: An identical export is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
              examples:
                ready:
                  $ref: "#/components/examples/ReadyExport"
        "202":
          description: The export is being prepared. Poll its `url`.
          headers:
            Location:
              description: URL of the export.
              schema:
                type: string
                format: uri-reference
              example: /exports/9f2c4e7a1b3d5f60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
              examples:
                queued:
                  $ref: "#/components/examples/QueuedExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "422":
          $ref: "#/components/responses/ValidationError"

  /exports/{export_id}:
    parameters:
      - $ref: "#/components/parameters/export_id"
    get:
      tags: [Exports]
      operationId: getExport
      summary: Get an export's status
      description: |
        Returns an export's status, and its `download_url` once it's ready. An export goes from `queued` to `running` to `ready`, or to `failed`. When it's deleted, it becomes `expired`, and creating it again rebuilds it.

        **Access:** public.
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
              examples:
                queued:
                  $ref: "#/components/examples/QueuedExport"
                ready:
                  $ref: "#/components/examples/ReadyExport"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/{export_id}/download:
    parameters:
      - $ref: "#/components/parameters/export_id"
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: Download an export
      description: |
        Downloads a ready export as a zip file. Range requests are supported, so an interrupted download can resume. Each download (a request from the first byte) counts towards the dataset's `downloads`.

        **Access:** public.
      parameters:
        - name: Range
          in: header
          description: Byte range to resume a download, as in HTTP.
          schema:
            type: string
          example: bytes=104857600-
      responses:
        "200":
          description: The zip file, with the data file and a README.
          headers:
            Content-Disposition:
              description: The file name.
              schema:
                type: string
              example: attachment; filename="datalakes-123-v14-9f2c4e7a1b3d5f60.zip"
            Accept-Ranges:
              schema:
                type: string
              example: bytes
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "206":
          description: The requested part of the zip file.
          headers:
            Content-Range:
              schema:
                type: string
              example: bytes 104857600-698351615/698351616
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "404":
          description: The export doesn't exist, or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: The export doesn't exist
                  value:
                    detail: Export 9f2c4e7a1b3d5f60 not found
                    code: not_found
                expired:
                  summary: The export expired
                  value:
                    detail: Export 9f2c4e7a1b3d5f60 has expired. Create it again with POST /exports.
                    code: export_expired
        "409":
          description: The export isn't ready yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Export 9f2c4e7a1b3d5f60 is still running (40 %)
                code: export_not_ready

  # ---------------------------------------------------------------------------
  # Maintenance
  # ---------------------------------------------------------------------------
  /admin/regenerate:
    post:
      tags: [Maintenance]
      operationId: startRegenerate
      summary: Rebuild many datasets
      description: |
        Starts a run that rebuilds the data of many datasets from their archived files, e.g. after the Zarr layout changes. Each dataset gets a `rebuild` job in the normal queue.

        - Leave out `dataset_ids` to rebuild all datasets, or list them.
        - With `only_failed`, only the datasets whose rebuild failed in the previous run are rebuilt.
        - With `sync`, each dataset is synced from its source before it's rebuilt.

        Only one run at a time. Cancelling a run's queued jobs stops it, and starting it again with `only_failed` and the remaining datasets resumes it.

        **Access:** owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRequest"
            examples:
              all:
                summary: All datasets
                value: {}
              failed:
                summary: Only the ones that failed last time
                value:
                  only_failed: true
              some:
                summary: A few datasets, synced first
                value:
                  dataset_ids: [123, 124]
                  sync: true
      responses:
        "202":
          description: The run started. Poll its `url`.
          headers:
            Location:
              description: URL of the run.
              schema:
                type: string
                format: uri-reference
              example: /admin/regenerate/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateRun"
              example:
                id: 7
                status: running
                dataset_ids: null
                only_failed: false
                sync: false
                total: 412
                done: 0
                failed: 0
                remaining: 412
                failures: []
                created_at: "2024-11-02T20:00:00Z"
                finished_at: null
                url: /admin/regenerate/7
        "409":
          description: A run is already going.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Regenerate run 6 is still running (230 of 412 done)
                code: run_in_progress
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/regenerate/{run_id}:
    parameters:
      - $ref: "#/components/parameters/run_id"
    get:
      tags: [Maintenance]
      operationId: getRegenerateRun
      summary: Get a regenerate run's progress
      description: |
        Returns how many datasets a run has rebuilt, how many failed and how many remain, with the error of each failure.

        **Access:** owner.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateRun"
              example:
                id: 7
                status: finished
                dataset_ids: null
                only_failed: false
                sync: false
                total: 412
                done: 409
                failed: 3
                remaining: 0
                failures:
                  - dataset_id: 288
                    job_id: 6120
                    error: "2 of 41 files failed: variable 'temp' not found"
                  - dataset_id: 301
                    job_id: 6131
                    error: Source archive is empty
                  - dataset_id: 455
                    job_id: 6177
                    error: "Depth axis changed in L2_CTD_2022.nc and can't be merged"
                created_at: "2024-11-02T20:00:00Z"
                finished_at: "2024-11-03T01:42:10Z"
                url: /admin/regenerate/7
        "404":
          $ref: "#/components/responses/NotFound"

  /datasets/{dataset_id}/sync-token:
    parameters:
      - $ref: "#/components/parameters/dataset_id"
    post:
      tags: [Maintenance]
      operationId: createSyncToken
      summary: Create or rotate a dataset's sync token
      description: |
        Creates a token that lets an external caller, such as a processing pipeline, trigger syncs of this one dataset (`POST /datasets/{dataset_id}/sync`) and nothing else. Creating a new token replaces the old one, which stops working at once.

        The token is shown only in this response and is stored hashed.

        **Access:** user (own datasets) or owner.
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncToken"
              example:
                dataset_id: 123
                token: dl_sync_123_q8Jf2LmX0vR7tYc4WnB9sKe1
                created_at: "2024-11-02T10:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The dataset is a link dataset and can't be synced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Dataset 2 is a link dataset and can't be synced
                code: link_dataset

components:
  schemas:
    Error:
      type: object
      description: The body of every error response.
      required: [detail, code]
      properties:
        detail:
          type: string
          description: Human-readable message.
          examples: [Dataset 999 not found]
        code:
          type: string
          description: Machine-readable code. Clients can rely on it not changing.
          examples: [not_found]
        errors:
          type: array
          description: Only on validation errors (422). One entry per invalid field.
          items:
            type: object
            required: [loc, msg]
            properties:
              loc:
                type: array
                description: Where the invalid value is, e.g. `["body", "options", "access_key_id"]`.
                items:
                  type: [string, integer]
              msg:
                type: string
                description: What is wrong with the value.
      examples:
        - detail: Dataset 999 not found
          code: not_found

    TooLargeError:
      description: Error body of a 413 response. Points to the export route, which prepares large downloads in the background.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [export_url]
          properties:
            export_url:
              type: string
              format: uri-reference
              description: Where to create an export with the same query, using `POST`.
              examples: [/exports]
            estimated_size:
              type: integer
              description: Estimated size of the response in bytes.
              examples: [734003200]
            max_size:
              type: integer
              description: Largest response size served synchronously, in bytes.
              examples: [52428800]
            export_request:
              description: The same query as an export request, ready to send to `POST /exports`.
              $ref: "#/components/schemas/ExportRequest"
      examples:
        - detail: The response would be too large. Create an export instead.
          code: response_too_large
          export_url: /exports
          estimated_size: 734003200
          max_size: 52428800
          export_request:
            dataset_id: 123
            variables: [temperature]
            start: "2019-01-01"
            end: "2023-12-31"
            format: netcdf

    Page:
      type: object
      description: |
        Envelope for every list. A list response combines this with its own `items`:

        ```yaml
        allOf:
          - $ref: "#/components/schemas/Page"
          - properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        ```
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: The entries on this page.
          items: {}
        total:
          type: integer
          minimum: 0
          description: Number of entries matching the filters, across all pages.
          examples: [250]
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Most entries on one page, as requested.
          examples: [100]
        offset:
          type: integer
          minimum: 0
          description: Number of entries skipped before this page, as requested.
          examples: [0]
      examples:
        - items: []
          total: 250
          limit: 100
          offset: 0

    Job:
      type: object
      description: |
        A piece of background work run by the worker. A job moves from `queued` to `running`, then ends as `succeeded`, `failed` or `cancelled`.
      required: [id, dataset_id, type, status, progress, error, log, result, created_at, started_at, finished_at, url]
      properties:
        id:
          type: integer
          description: Job ID.
          examples: [5812]
        dataset_id:
          type: [integer, "null"]
          description: The dataset the job works on, or `null` for jobs that aren't about one dataset.
          examples: [123]
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Fraction done, from 0 to 1, or `null` if unknown.
          examples: [0.4]
        error:
          type: [string, "null"]
          description: Why the job failed, or `null`.
        log:
          type: string
          description: The last lines of the job's log.
        result:
          description: |
            What the job produced. Its shape depends on `type`:

            - `sync`: `SyncResult`, what was copied and processed.
            - `inspect`: `InspectResult`, the suggested variables.
            - `rebuild`: `SyncResult`, with nothing copied.
            - `export`: `{"export_id": …}`. The export itself is at `GET /exports/{export_id}`.

            `null` until the job ends.
          anyOf:
            - $ref: "#/components/schemas/SyncResult"
            - $ref: "#/components/schemas/InspectResult"
            - type: object
            - type: "null"
        created_at:
          type: string
          format: date-time
          description: When the job was queued.
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the worker started the job.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the job ended.
        url:
          type: string
          format: uri-reference
          description: Poll this URL to follow the job.
          examples: [/jobs/5812]
      examples:
        - id: 5812
          dataset_id: 123
          type: sync
          status: queued
          progress: null
          error: null
          log: ""
          result: null
          created_at: "2024-03-01T10:20:00Z"
          started_at: null
          finished_at: null
          url: /jobs/5812

    JobType:
      type: string
      description: |
        - `sync`: copy new files from the source and process them.
        - `inspect`: read a sample file and suggest variables.
        - `rebuild`: rebuild a dataset's Zarr stores from its archived files.
        - `export`: prepare a large download.
      enum: [sync, inspect, rebuild, export]

    JobStatus:
      type: string
      description: "`queued` → `running` → `succeeded`, `failed` or `cancelled`."
      enum: [queued, running, succeeded, failed, cancelled]

    JobPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Job"

    SyncResult:
      type: object
      description: The result of a sync job.
      required: [files_new, files_changed, files_unchanged, bytes_copied, files_processed, files_failed]
      properties:
        files_new:
          type: integer
          minimum: 0
          description: Files copied that weren't in the archive yet.
        files_changed:
          type: integer
          minimum: 0
          description: Files copied again because they changed in the source.
        files_unchanged:
          type: integer
          minimum: 0
          description: Files skipped because the archive already has them.
        bytes_copied:
          type: integer
          minimum: 0
        files_processed:
          type: integer
          minimum: 0
          description: New and changed files added to the dataset's data.
        files_failed:
          type: array
          description: Files that couldn't be processed. They're marked `failed` in the file index.
          items:
            type: object
            required: [path, error]
            properties:
              path:
                type: string
              error:
                type: string

    # -------------------------------------------------------------------------
    # Sources
    # -------------------------------------------------------------------------
    SourcePath:
      type: string
      default: ""
      description: Folder inside the bucket or share, without a leading slash. Empty for the whole bucket or share. For S3, this is the prefix.
      pattern: "^(?!/)(?!.*(^|/)\\.\\.(/|$)).*$"
      examples: [thermistorchain/Level2]

    SourceInclude:
      type: array
      default: []
      description: Which files to sync, as [rclone filter patterns](https://rclone.org/filtering/), relative to `path`. Empty for all files.
      items:
        type: string
      examples: [["*.nc"]]

    S3Options:
      type: object
      description: Options for an S3 source. Only these are accepted.
      required: [bucket]
      additionalProperties: false
      properties:
        bucket:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
          examples: [eawag-lexplore]
        region:
          type: [string, "null"]
          description: Region of the bucket, for Amazon S3.
          examples: [eu-central-1]
        endpoint:
          type: [string, "null"]
          format: uri
          pattern: "^https://"
          description: URL of an S3-compatible store. Leave it out for Amazon S3. Addresses in private or internal networks are rejected.
          examples: [https://s3.example.org]

    SwitchdriveOptions:
      type: object
      description: Options for a SWITCHdrive source. Only these are accepted.
      required: [share_url]
      additionalProperties: false
      properties:
        share_url:
          type: string
          pattern: "^https://drive\\.switch\\.ch/index\\.php/s/[A-Za-z0-9]+/?$"
          description: The share's public link. Only the share token in it (the last part) is stored, and responses rebuild the link from it. Password-protected shares are rejected.
          examples: [https://drive.switch.ch/index.php/s/aB3dE5fG7hJ9kL1]

    S3SourceInput:
      type: object
      title: S3
      required: [backend, options]
      additionalProperties: false
      properties:
        backend:
          type: string
          const: s3
        options:
          $ref: "#/components/schemas/S3Options"
        path:
          $ref: "#/components/schemas/SourcePath"
        include:
          $ref: "#/components/schemas/SourceInclude"

    SwitchdriveSourceInput:
      type: object
      title: SWITCHdrive
      required: [backend, options]
      additionalProperties: false
      properties:
        backend:
          type: string
          const: switchdrive
        options:
          $ref: "#/components/schemas/SwitchdriveOptions"
        path:
          $ref: "#/components/schemas/SourcePath"
        include:
          $ref: "#/components/schemas/SourceInclude"

    SourceInput:
      description: |
        Where a dataset's files are, as sent to set or test a source. The `options` depend on the `backend`, and `GET /source-types` lists them.

        Sources are read anonymously, and nothing that looks like a credential is accepted. A config is rejected with 422 if it has:

        - an option that isn't listed for its backend (`unknown_option`),
        - an option that looks like a credential, such as `access_key_id`, `secret_access_key`, `session_token`, `password`, `pass`, `token`, `bearer_token` or `user` (`credentials_not_allowed`),
        - a link to a password-protected SWITCHdrive share (`credentials_not_allowed`).
      oneOf:
        - $ref: "#/components/schemas/S3SourceInput"
        - $ref: "#/components/schemas/SwitchdriveSourceInput"
      discriminator:
        propertyName: backend
        mapping:
          s3: "#/components/schemas/S3SourceInput"
          switchdrive: "#/components/schemas/SwitchdriveSourceInput"

    SourceFields:
      type: object
      description: Fields every stored source has.
      required: [dataset_id, path, include, last_tested_at, last_synced_at, created_at, updated_at]
      properties:
        dataset_id:
          type: integer
          examples: [123]
        path:
          $ref: "#/components/schemas/SourcePath"
        include:
          $ref: "#/components/schemas/SourceInclude"
        last_tested_at:
          type: string
          format: date-time
          description: When the source was last read successfully, by a test or a sync.
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful sync finished.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    S3Source:
      title: S3
      allOf:
        - $ref: "#/components/schemas/SourceFields"
        - type: object
          required: [backend, options]
          properties:
            backend:
              type: string
              const: s3
            options:
              $ref: "#/components/schemas/S3Options"

    SwitchdriveSource:
      title: SWITCHdrive
      allOf:
        - $ref: "#/components/schemas/SourceFields"
        - type: object
          required: [backend, options]
          properties:
            backend:
              type: string
              const: switchdrive
            options:
              $ref: "#/components/schemas/SwitchdriveOptions"

    Source:
      description: Where a dataset's files come from. A dataset has at most one source.
      oneOf:
        - $ref: "#/components/schemas/S3Source"
        - $ref: "#/components/schemas/SwitchdriveSource"
      discriminator:
        propertyName: backend
        mapping:
          s3: "#/components/schemas/S3Source"
          switchdrive: "#/components/schemas/SwitchdriveSource"

    SourceTypeOption:
      type: object
      required: [name, type, required, description, example]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, integer, boolean]
        required:
          type: boolean
        description:
          type: string
        example:
          description: An example value.

    SourceType:
      type: object
      description: A backend a source can use.
      required: [backend, name, description, path_description, options]
      properties:
        backend:
          type: string
          enum: [s3, switchdrive]
        name:
          type: string
          description: Name to show in a form.
        description:
          type: string
        path_description:
          type: string
          description: What `path` means for this backend.
        options:
          type: array
          description: The options accepted in a source's `options`.
          items:
            $ref: "#/components/schemas/SourceTypeOption"

    SourceTypePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SourceType"

    SourceEntry:
      type: object
      description: A file or folder in a source.
      required: [path, is_dir, size, modified_at, included]
      properties:
        path:
          type: string
          description: Path relative to the source's `path`.
          examples: [2024/L2_ThermistorChain_202406.nc]
        is_dir:
          type: boolean
        size:
          type: [integer, "null"]
          description: Size in bytes. `null` for folders.
        modified_at:
          type: [string, "null"]
          format: date-time
          description: When the file last changed in the source. `null` for folders when the backend doesn't report it.
        included:
          type: boolean
          description: Whether the source's `include` patterns select this file. Folders are included when they may contain included files.

    SourceEntryPage:
      description: A page of the contents of a folder in a source.
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [path, truncated]
          properties:
            path:
              type: string
              description: The folder listed, relative to the source's `path`.
            items:
              type: array
              items:
                $ref: "#/components/schemas/SourceEntry"
            truncated:
              type: boolean
              description: "`true` when the folder has more than 10 000 entries. Only the first 10 000 are listed, and `total` counts only those."

    SourceTestResult:
      type: object
      description: The result of testing a source.
      required: [ok, error, files, truncated]
      properties:
        ok:
          type: boolean
          description: Whether the source could be listed anonymously.
        error:
          description: Why the source couldn't be read, or `null`. `code` is one of `source_not_found`, `source_not_public` or `source_timeout`.
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
        files:
          type: array
          description: The first files and folders in the source, up to 100, including subfolders.
          items:
            $ref: "#/components/schemas/SourceEntry"
        truncated:
          type: boolean
          description: "`true` when the source has more than 100 entries."

    # -------------------------------------------------------------------------
    # Sync, inspect and status
    # -------------------------------------------------------------------------
    InspectRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          description: Path of the file to inspect, relative to the source's `path`, as listed by `GET /datasets/{dataset_id}/source/files`. NetCDF and HDF5 files are supported.
          examples: [2024/L2_ThermistorChain_202406.nc]

    InspectedVariable:
      description: A suggested variable, ready to send to `POST /datasets/{dataset_id}/variables`, with what was found in the file.
      allOf:
        - $ref: "#/components/schemas/VariableCreate"
        - type: object
          required: [shape, attributes]
          properties:
            shape:
              type: array
              description: Size of each dimension in the sample file.
              items:
                type: integer
              examples: [[4320, 32]]
            attributes:
              type: object
              description: The variable's attributes in the file, e.g. `units`, `long_name` and `standard_name`.

    InspectResult:
      type: object
      description: "The result of an inspect job. Nothing is saved: the suggestions are meant to be reviewed before the variables are created."
      required: [file, format, feature_type, variables, location, global_attributes, warnings]
      properties:
        file:
          type: string
          description: The file inspected.
        format:
          type: string
          enum: [netcdf3, netcdf4]
          description: File format. `netcdf4` also covers HDF5.
        feature_type:
          description: The suggested feature type, or `null` if it couldn't be guessed.
          anyOf:
            - $ref: "#/components/schemas/FeatureTypeName"
            - type: "null"
        variables:
          type: array
          description: Suggested variables, coordinates first. `parameter_id` is a guess from the variable's name and attributes.
          items:
            $ref: "#/components/schemas/InspectedVariable"
        location:
          description: Where the data is from, when the file gives it in its global attributes instead of as variables.
          anyOf:
            - type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
            - type: "null"
        global_attributes:
          type: object
          description: The file's global attributes.
        warnings:
          type: array
          description: Things to check before saving, e.g. guesses about time units or missing values.
          items:
            type: string

    DatasetStatus:
      type: object
      description: Whether a live dataset is up to date.
      required: [dataset_id, live, update_interval, latest_data_at, overdue, overdue_since, last_sync, checked_at]
      properties:
        dataset_id:
          type: integer
        live:
          type: boolean
          description: Whether the dataset has an `update_interval`.
        update_interval:
          type: [integer, "null"]
          description: Expected seconds between updates.
        latest_data_at:
          type: [string, "null"]
          format: date-time
          description: Time of the latest value (the dataset's `time_end`).
        overdue:
          type: boolean
          description: "`true` when `latest_data_at` is more than `update_interval` seconds ago. Always `false` for datasets that aren't live."
        overdue_since:
          type: [string, "null"]
          format: date-time
          description: When the dataset became overdue (`latest_data_at` + `update_interval`), or `null`.
        last_sync:
          description: The latest sync job that ended, or `null` if there was none.
          anyOf:
            - type: object
              required: [job_id, status, finished_at]
              properties:
                job_id:
                  type: integer
                status:
                  $ref: "#/components/schemas/JobStatus"
                finished_at:
                  type: string
                  format: date-time
            - type: "null"
        checked_at:
          type: string
          format: date-time
          description: When this answer was computed.

    # -------------------------------------------------------------------------
    # Files
    # -------------------------------------------------------------------------
    FileStatus:
      type: string
      description: |
        - `new`: copied from the source, not processed yet.
        - `ok`: processed into the dataset's data.
        - `failed`: couldn't be processed, as explained in `error`. It's tried again when the file changes in the source.
      enum: [new, ok, failed]

    File:
      type: object
      description: A file in the dataset's archive, copied from its source.
      required: [id, dataset_id, path, size, modified_at, hash, time_start, time_end, status, error]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        path:
          type: string
          description: Path relative to the source's `path`.
          examples: [2024/L2_ThermistorChain_202409.nc]
        size:
          type: integer
          description: Size in bytes.
        modified_at:
          type: string
          format: date-time
          description: When the file last changed in the source.
        hash:
          type: [string, "null"]
          description: Checksum reported by the source (e.g. MD5 for S3), used to notice changes.
        time_start:
          type: [string, "null"]
          format: date-time
          description: Time of the file's first value. `null` until the file is processed.
        time_end:
          type: [string, "null"]
          format: date-time
          description: Time of the file's last value. `null` until the file is processed.
        status:
          $ref: "#/components/schemas/FileStatus"
        error:
          type: [string, "null"]
          description: Why processing failed, or `null`.

    FilePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/File"

    # -------------------------------------------------------------------------
    # Shared
    # -------------------------------------------------------------------------
    Geometry:
      type: object
      description: A GeoJSON geometry in WGS 84. Positions are `[longitude, latitude]`.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon]
        coordinates:
          type: array
          description: Coordinates as in GeoJSON, e.g. `[6.5, 46.45]` for a point.
          items: {}
      examples:
        - type: Point
          coordinates: [6.5, 46.45]

    FeatureTypeName:
      type: string
      description: |
        The shape of a dataset's data, from the [CF discrete sampling geometries](https://cfconventions.org/Data/cf-conventions/cf-conventions-1.11/cf-conventions.html#discrete-sampling-geometries):

        - `timeSeries`: values over time at one place, e.g. a weather station.
        - `timeSeriesProfile`: values over time and depth at one place, e.g. a thermistor chain.
        - `profile`: separate casts, each at one time, over depth, e.g. CTD casts.
      enum: [timeSeries, timeSeriesProfile, profile]

    # -------------------------------------------------------------------------
    # Datasets
    # -------------------------------------------------------------------------
    DatasetBase:
      type: object
      description: The fields of a dataset that can be set.
      properties:
        title:
          type: string
          minLength: 1
          examples: [LéXPLORE thermistor chain]
        description:
          type: [string, "null"]
          examples: [Water temperature from 0.5 m to 110 m below the LéXPLORE platform on Lake Geneva, every 10 minutes.]
        status:
          type: string
          enum: [published, draft]
          description: |
            - `published`: listed by `GET /datasets`.
            - `draft`: left out of lists, but can be read by ID. Use it for test and work-in-progress datasets.
        external_url:
          type: [string, "null"]
          format: uri
          description: Where the data is shown. Required for link datasets, and only allowed for them.
          examples: [https://www.alplakes.eawag.ch/geneva]
        feature_type:
          description: The shape of the data. `null` for link datasets, and for data datasets until it's known.
          anyOf:
            - $ref: "#/components/schemas/FeatureTypeName"
            - type: "null"
        site_id:
          type: [integer, "null"]
          description: The site the data is from.
          examples: [1]
        person_id:
          type: [integer, "null"]
          description: Contact person, from the `persons` vocabulary.
          examples: [1]
        organisation_id:
          type: [integer, "null"]
          description: Organisation, from the `organisations` vocabulary.
          examples: [1]
        license_id:
          type: [integer, "null"]
          description: License, from the `licenses` vocabulary.
          examples: [1]
        repository_url:
          type: [string, "null"]
          format: uri
          description: Web address of the code that produces the data, for provenance, e.g. a GitHub repository or one of its branches. It's only a link, and data is never read from it.
          examples: [https://github.com/LeXPLORE-Platform/Meteostation]
        origin:
          type: [string, "null"]
          description: How the data was obtained, e.g. `measurement`, `model` or `satellite`.
          examples: [measurement]
        citation:
          type: [string, "null"]
          description: How to cite the dataset.
        datasource_link:
          type: [string, "null"]
          description: Where users can find the original data, if it's published elsewhere.
        plot_config:
          type: [object, "null"]
          description: |
            Plot settings for the website, such as colours, map marker style, or whether time runs along the x or y axis. The API stores and returns them without reading or validating them.
          examples:
            - colors: Rainbow
              time_axis: x
              map_marker: marker
        update_interval:
          type: [integer, "null"]
          minimum: 1
          description: Expected seconds between updates for a live dataset, or `null` if it isn't updated regularly. Used to tell whether the dataset is overdue.
          examples: [3600]
        sync_interval:
          type: [integer, "null"]
          minimum: 1
          description: Minutes between scheduled syncs, for datasets that no external caller syncs. `null` for no schedule.
          examples: [60]
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
          description: Where the data is from, for the map. Set by the build when the files contain a location, and set by hand otherwise, e.g. for link datasets.
          examples: [46.5004]
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
          description: See `latitude`.
          examples: [6.6588]

    DatasetCreate:
      description: A new dataset.
      allOf:
        - $ref: "#/components/schemas/DatasetBase"
        - type: object
          required: [title]
          properties:
            kind:
              type: string
              enum: [data, link]
              default: data
              description: |
                - `data`: data read from a source, with variables.
                - `link`: only metadata and an `external_url`, e.g. a model shown on Alplakes. No source, variables, sync or data.

                Can't be changed later.
            status:
              type: string
              enum: [published, draft]
              default: draft

    DatasetUpdate:
      description: Changes to a dataset. Only the fields sent are changed, and `null` clears a field.
      allOf:
        - $ref: "#/components/schemas/DatasetBase"

    Dataset:
      description: A dataset, as listed.
      allOf:
        - $ref: "#/components/schemas/DatasetBase"
        - type: object
          required:
            - id
            - title
            - description
            - status
            - kind
            - external_url
            - feature_type
            - site_id
            - person_id
            - organisation_id
            - license_id
            - repository_url
            - origin
            - citation
            - datasource_link
            - plot_config
            - update_interval
            - sync_interval
            - latitude
            - longitude
            - time_start
            - time_end
            - depth_min
            - depth_max
            - downloads
            - version
            - created_at
            - updated_at
            - parameters
          properties:
            id:
              type: integer
              examples: [123]
            kind:
              type: string
              enum: [data, link]
            time_start:
              type: [string, "null"]
              format: date-time
              description: Time of the first value. Computed from the data, and `null` for link datasets and before the first sync.
            time_end:
              type: [string, "null"]
              format: date-time
              description: Time of the last value. Computed like `time_start`.
            depth_min:
              type: [number, "null"]
              description: Shallowest depth in metres. Computed from the data, and `null` if the data has no depth.
            depth_max:
              type: [number, "null"]
              description: Deepest depth in metres. Computed like `depth_min`.
            downloads:
              type: integer
              minimum: 0
              description: How often the dataset was downloaded.
            version:
              type: integer
              minimum: 1
              description: Goes up whenever the dataset's data or metadata changes, including its variables and issues. Data responses send it as their `ETag`.
              examples: [14]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            parameters:
              type: array
              description: The parameters measured by the dataset's data variables, for lists and filters. Empty for link datasets.
              items:
                $ref: "#/components/schemas/ParameterSummary"

    DatasetDetail:
      description: A dataset with its site, variables, collections and a summary of its source.
      allOf:
        - $ref: "#/components/schemas/Dataset"
        - type: object
          required: [site, variables, collections, source]
          properties:
            site:
              anyOf:
                - $ref: "#/components/schemas/SiteSummary"
                - type: "null"
            variables:
              type: array
              description: All variables. Empty for link datasets.
              items:
                $ref: "#/components/schemas/Variable"
            collections:
              type: array
              description: The collections the dataset belongs to.
              items:
                $ref: "#/components/schemas/CollectionSummary"
            source:
              description: Summary of the dataset's source, or `null` if it has none. Always `null` for link datasets.
              anyOf:
                - $ref: "#/components/schemas/SourceSummary"
                - type: "null"

    DatasetSummary:
      type: object
      description: A short description of a dataset, used inside other resources.
      required: [id, title, kind, feature_type, time_start, time_end]
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          type: string
          enum: [data, link]
        feature_type:
          anyOf:
            - $ref: "#/components/schemas/FeatureTypeName"
            - type: "null"
        time_start:
          type: [string, "null"]
          format: date-time
        time_end:
          type: [string, "null"]
          format: date-time

    DatasetPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"

    ParameterSummary:
      type: object
      required: [id, name, unit]
      properties:
        id:
          type: integer
          examples: [5]
        name:
          type: string
          examples: [Water temperature]
        unit:
          type: [string, "null"]
          description: The unit of the dataset's variable measuring this parameter.
          examples: [degC]

    SourceSummary:
      type: object
      description: Where the dataset's files come from. The full source is at `url`.
      required: [backend, last_synced_at, url]
      properties:
        backend:
          type: string
          enum: [s3, switchdrive]
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful sync finished.
        url:
          type: string
          format: uri-reference
          examples: [/datasets/123/source]

    # -------------------------------------------------------------------------
    # Variables
    # -------------------------------------------------------------------------
    VariableRole:
      type: string
      description: |
        - `time`: the time coordinate.
        - `coordinate`: another coordinate the data runs along, e.g. depth or wavelength.
        - `data`: measured or computed values.
        - `flag`: quality flags for a data variable, named in `flag_for`.
      enum: [time, coordinate, data, flag]

    Decoding:
      type: object
      description: How to read values that the file doesn't describe in a standard way. Suggested by the inspect job.
      properties:
        time_units:
          type: string
          description: For time variables without CF units. CF-style units such as `seconds since 1970-01-01 00:00:00`, or `matlab_datenum`.
          examples: [seconds since 1970-01-01 00:00:00]
        missing_values:
          type: array
          description: Values that mean "no data", on top of the file's own fill value.
          items:
            type: number
          examples: [[-9999]]
        valid_min:
          type: number
          description: Values below this are treated as missing.
        valid_max:
          type: number
          description: Values above this are treated as missing.
          examples: [1.0e+31]

    VariableBase:
      type: object
      description: The fields of a variable that can be set.
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Name used by the API, e.g. in `?variables=temperature`. Unique in the dataset.
          examples: [temperature]
        source_name:
          type: string
          description: Name of the variable in the source files.
          examples: [temp]
        role:
          $ref: "#/components/schemas/VariableRole"
        dimensions:
          type: array
          minItems: 1
          description: Names of the `time` and `coordinate` variables this variable runs along, in the order of the data. A coordinate's only dimension is itself.
          items:
            type: string
          examples: [[time, depth]]
        unit:
          type: [string, "null"]
          description: Unit of the values, e.g. `degC`, `m` or `mg/L`.
          examples: [degC]
        parameter_id:
          type: [integer, "null"]
          description: What the variable measures, from the `parameters` vocabulary.
          examples: [5]
        sensor_id:
          type: [integer, "null"]
          description: The sensor used, from the `sensors` vocabulary.
          examples: [7]
        flag_for:
          type: [string, "null"]
          description: For `flag` variables, the name of the data variable they flag. `null` for other roles.
          examples: [temperature]
        description:
          type: [string, "null"]
        decoding:
          anyOf:
            - $ref: "#/components/schemas/Decoding"
            - type: "null"

    VariableCreate:
      description: A new variable.
      allOf:
        - $ref: "#/components/schemas/VariableBase"
        - type: object
          required: [name, source_name, role, dimensions]

    VariableUpdate:
      description: Changes to a variable. Only the fields sent are changed, and `null` clears a field.
      allOf:
        - $ref: "#/components/schemas/VariableBase"

    Variable:
      description: A variable of a dataset.
      allOf:
        - $ref: "#/components/schemas/VariableBase"
        - type: object
          required: [id, dataset_id, name, source_name, role, dimensions, unit, parameter_id, sensor_id, flag_for, description, decoding, legacy_axis]
          properties:
            id:
              type: integer
              examples: [903]
            dataset_id:
              type: integer
              examples: [123]
            legacy_axis:
              type: [string, "null"]
              readOnly: true
              pattern: "^[Mxyz][0-9]*$"
              description: |
                The variable's axis in the old Datalakes system (`x`, `y`, `z`, `M`, optionally followed by a digit, e.g. `z1`), kept so that old links keep working.

                Set only by the migration from the old system and unique within a dataset. `null` for variables created later. It can't be set or changed through the API.
              examples: [z]

    VariablePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Variable"

    # -------------------------------------------------------------------------
    # Sites
    # -------------------------------------------------------------------------
    SiteBase:
      type: object
      description: The fields of a site that can be set.
      properties:
        name:
          type: string
          minLength: 1
          examples: [Lake Geneva]
        type:
          type: string
          description: What kind of site it is, from the `site_types` vocabulary.
          examples: [lake]
        geometry:
          description: Where the site is, e.g. a point or the outline of a lake.
          anyOf:
            - $ref: "#/components/schemas/Geometry"
            - type: "null"
        properties:
          type: object
          description: Facts that depend on the type of site, e.g. a lake's elevation and maximum depth.
          examples:
            - elevation_m: 372
              max_depth_m: 309
              morphology: true

    SiteCreate:
      description: A new site.
      allOf:
        - $ref: "#/components/schemas/SiteBase"
        - type: object
          required: [name, type]

    SiteUpdate:
      description: Changes to a site. Only the fields sent are changed.
      allOf:
        - $ref: "#/components/schemas/SiteBase"

    Site:
      description: A place where data is measured.
      allOf:
        - $ref: "#/components/schemas/SiteBase"
        - type: object
          required: [id, name, type, geometry, properties]
          properties:
            id:
              type: integer
              examples: [1]

    SiteSummary:
      type: object
      description: A short description of a site, used inside other resources.
      required: [id, name, type]
      properties:
        id:
          type: integer
          examples: [1]
        name:
          type: string
          examples: [Lake Geneva]
        type:
          type: string
          examples: [lake]

    SitePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Site"

    # -------------------------------------------------------------------------
    # Collections
    # -------------------------------------------------------------------------
    CollectionBase:
      type: object
      description: The fields of a collection that can be set.
      properties:
        slug:
          type: string
          pattern: "^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$"
          description: Short name for URLs, unique. Lowercase letters, digits and hyphens, with at least one letter so it can't be mistaken for an ID.
          examples: [lexplore]
        name:
          type: string
          minLength: 1
          examples: [LéXPLORE]
        description:
          type: [string, "null"]
        link:
          type: [string, "null"]
          format: uri
          description: Website of the project or platform.
          examples: [https://wp.unil.ch/lexplore/]
        site_id:
          type: [integer, "null"]
          description: The site the collection is at, if it's at one.
          examples: [1]
        geometry:
          description: Where the collection is, e.g. the position of a platform.
          anyOf:
            - $ref: "#/components/schemas/Geometry"
            - type: "null"
        properties:
          type: object
          description: Extra facts, e.g. the instruments on a platform.

    CollectionCreate:
      description: A new collection.
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          required: [slug, name]

    CollectionUpdate:
      description: Changes to a collection. Only the fields sent are changed.
      allOf:
        - $ref: "#/components/schemas/CollectionBase"

    Collection:
      description: A group of datasets, as listed.
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          required: [id, slug, name, description, link, site_id, geometry, properties, dataset_count]
          properties:
            id:
              type: integer
              examples: [2]
            dataset_count:
              type: integer
              minimum: 0
              description: Number of published datasets in the collection.
              examples: [2]

    CollectionDetail:
      description: A collection with its published datasets.
      allOf:
        - $ref: "#/components/schemas/Collection"
        - type: object
          required: [datasets]
          properties:
            datasets:
              type: array
              items:
                $ref: "#/components/schemas/DatasetSummary"

    CollectionSummary:
      type: object
      description: A short description of a collection, used inside other resources.
      required: [id, slug, name]
      properties:
        id:
          type: integer
          examples: [2]
        slug:
          type: string
          examples: [lexplore]
        name:
          type: string
          examples: [LéXPLORE]

    CollectionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Collection"

    # -------------------------------------------------------------------------
    # Issues
    # -------------------------------------------------------------------------
    IssueCategory:
      type: string
      description: |
        - `problem`: the data is wrong or unreliable, e.g. maintenance, a sensor fault or a calibration. Masked by `mask=true`.
        - `event`: the data is correct, and the event explains it, e.g. a storm or ice cover. Never masked.
      enum: [problem, event]

    IssueState:
      type: string
      description: "For problems: `open` while the problem lasts or isn't checked yet, `resolved` once it's dealt with."
      enum: [open, resolved]

    IssueBase:
      type: object
      description: The fields of an issue that can be set.
      properties:
        variable_id:
          type: [integer, "null"]
          description: The affected variable, or `null` if the whole dataset is affected.
          examples: [903]
        start:
          type: string
          format: date-time
          examples: ["2024-06-12T08:00:00Z"]
        end:
          type: [string, "null"]
          format: date-time
          description: "`null` while it's still going on."
          examples: ["2024-06-20T14:30:00Z"]
        depth_min:
          type: [number, "null"]
          description: Shallowest affected depth in metres, or `null` for all depths.
          examples: [2.0]
        depth_max:
          type: [number, "null"]
          description: Deepest affected depth in metres, or `null` for all depths.
          examples: [3.0]
        type:
          type: string
          description: What happened, e.g. `maintenance`, `sensor_fault` or `calibration` for problems, and `storm`, `ice_cover` or `algal_bloom` for events.
          examples: [sensor_fault]
        description:
          type: [string, "null"]
        reporter:
          type: [string, "null"]
          description: Who reported it.
        state:
          description: The state of a problem. Always `null` for events.
          anyOf:
            - $ref: "#/components/schemas/IssueState"
            - type: "null"

    IssueCreate:
      description: A new issue.
      allOf:
        - $ref: "#/components/schemas/IssueBase"
        - type: object
          required: [start, type]
          properties:
            category:
              $ref: "#/components/schemas/IssueCategory"
              default: problem
            state:
              description: Defaults to `open` for problems. Must be left out or `null` for events.
              anyOf:
                - $ref: "#/components/schemas/IssueState"
                - type: "null"

    IssueUpdate:
      description: Changes to an issue. Only the fields sent are changed, and `null` clears a field. The category can't be changed.
      allOf:
        - $ref: "#/components/schemas/IssueBase"

    Issue:
      description: Something that affected a dataset's data during a period, either a problem with the data or an event that explains it.
      allOf:
        - $ref: "#/components/schemas/IssueBase"
        - type: object
          required: [id, dataset_id, category, variable_id, start, end, depth_min, depth_max, type, description, reporter, state, created_at, updated_at]
          properties:
            id:
              type: integer
              examples: [77]
            dataset_id:
              type: integer
              examples: [123]
            category:
              $ref: "#/components/schemas/IssueCategory"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    IssuePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Issue"

    # -------------------------------------------------------------------------
    # Vocabularies
    # -------------------------------------------------------------------------
    ParameterBase:
      type: object
      description: A physical or chemical quantity, e.g. water temperature.
      required: [name]
      properties:
        name:
          type: string
          examples: [Water temperature]
        cf_name:
          type: [string, "null"]
          description: The matching CF standard name, if there is one.
          examples: [water_temperature]
        description:
          type: [string, "null"]
        unit:
          type: [string, "null"]
          description: The usual unit.
          examples: [degC]
        characteristic:
          type: [string, "null"]
          description: Broad group, e.g. `Physical`, `Chemical` or `Biological`.
          examples: [Physical]
        name_de:
          type: [string, "null"]
        name_fr:
          type: [string, "null"]
        name_it:
          type: [string, "null"]

    Parameter:
      allOf:
        - $ref: "#/components/schemas/ParameterBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              examples: [5]

    OrganisationBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [Eawag]
        link:
          type: [string, "null"]
          format: uri
          examples: [https://www.eawag.ch/]

    Organisation:
      allOf:
        - $ref: "#/components/schemas/OrganisationBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              examples: [1]

    PersonBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
        organisation_id:
          type: [integer, "null"]
          examples: [1]
        email:
          type: [string, "null"]
          format: email
          description: Only returned to signed-in users.

    Person:
      allOf:
        - $ref: "#/components/schemas/PersonBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              examples: [1]

    SensorBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [TidBit MX2203 calibrated]
        manufacturer:
          type: [string, "null"]
          examples: [Onset (calibrated by Eawag)]
        accuracy:
          type: [string, "null"]
          description: Accuracy as stated by the manufacturer, free text.
          examples: ["0.05"]
        link:
          type: [string, "null"]
          format: uri

    Sensor:
      allOf:
        - $ref: "#/components/schemas/SensorBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              examples: [7]

    LicenseBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [CC BY 4.0]
        description:
          type: [string, "null"]
        link:
          type: [string, "null"]
          format: uri

    License:
      allOf:
        - $ref: "#/components/schemas/LicenseBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              examples: [1]

    NamedEntry:
      type: object
      description: An entry of the `site_types`, `feature_types` or `variable_roles` vocabularies, identified by its name.
      required: [name, description]
      properties:
        name:
          type: string
          examples: [lake]
        description:
          type: [string, "null"]
          examples: [A lake or reservoir.]

    Vocabulary:
      type: object
      description: A shared list used in metadata.
      required: [name, description, fixed, entry_count, url]
      properties:
        name:
          type: string
          enum: [parameters, organisations, persons, sensors, licenses, site_types, feature_types, variable_roles]
        description:
          type: string
        fixed:
          type: boolean
          description: "`true` when entries can't be added, because the API depends on their values."
        entry_count:
          type: integer
          minimum: 0
        url:
          type: string
          format: uri-reference
          description: Where the entries are listed.
          examples: [/vocabularies/sensors]

    VocabularyPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Vocabulary"

    VocabularyEntry:
      description: An entry of one vocabulary. Its shape depends on the vocabulary.
      anyOf:
        - $ref: "#/components/schemas/Parameter"
        - $ref: "#/components/schemas/Organisation"
        - $ref: "#/components/schemas/Person"
        - $ref: "#/components/schemas/Sensor"
        - $ref: "#/components/schemas/License"
        - $ref: "#/components/schemas/NamedEntry"

    VocabularyEntryCreate:
      description: A new entry. Its shape depends on the vocabulary.
      anyOf:
        - $ref: "#/components/schemas/ParameterBase"
        - $ref: "#/components/schemas/OrganisationBase"
        - $ref: "#/components/schemas/PersonBase"
        - $ref: "#/components/schemas/SensorBase"
        - $ref: "#/components/schemas/LicenseBase"
        - $ref: "#/components/schemas/NamedEntry"

    VocabularyEntryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/VocabularyEntry"

    # -------------------------------------------------------------------------
    # Data
    # -------------------------------------------------------------------------
    DataQuery:
      type: object
      description: The query as it was answered, with defaults filled in.
      required: [variables, start, end, depth_min, depth_max, resample, mask]
      properties:
        variables:
          type: array
          items:
            type: string
        start:
          type: [string, "null"]
          format: date-time
        end:
          type: [string, "null"]
          format: date-time
        depth_min:
          type: [number, "null"]
        depth_max:
          type: [number, "null"]
        resample:
          type: [string, "null"]
          description: The step used, either the one requested or the one chosen for `max_points`. `null` for the original values.
          examples: [1D]
        mask:
          type: boolean

    DataCoordinate:
      type: object
      description: The values of a coordinate.
      required: [unit, dimensions, values]
      properties:
        unit:
          type: [string, "null"]
          description: Unit of the values. `UTC` for times, which are ISO 8601 strings.
          examples: [m]
        dimensions:
          type: array
          description: The dimensions the coordinate runs along. Usually just itself, but for profile datasets depth runs along `profile` and `level`.
          items:
            type: string
          examples: [[depth]]
        values:
          type: array
          description: Values, nested by dimension.
          items: {}

    DataVariable:
      type: object
      description: The values of a variable.
      required: [parameter, unit, dimensions, values]
      properties:
        parameter:
          type: [string, "null"]
          description: Name of the parameter the variable measures.
          examples: [Water temperature]
        unit:
          type: [string, "null"]
          examples: [degC]
        dimensions:
          type: array
          description: Names of the coordinates the values run along, outermost first.
          items:
            type: string
          examples: [[time, depth]]
        flag_for:
          type: [string, "null"]
          description: For flag variables, the variable they flag.
        values:
          type: array
          description: Values nested by dimension. Missing values are `null`.
          items: {}

    IssueSummary:
      type: object
      description: An issue that overlaps the requested data. The full issue is at `GET /datasets/{dataset_id}/issues`.
      required: [id, category, variable, start, end, depth_min, depth_max, type, state]
      properties:
        id:
          type: integer
        category:
          $ref: "#/components/schemas/IssueCategory"
        variable:
          type: [string, "null"]
          description: Name of the affected variable, or `null` if the whole dataset is affected.
        start:
          type: string
          format: date-time
        end:
          type: [string, "null"]
          format: date-time
        depth_min:
          type: [number, "null"]
        depth_max:
          type: [number, "null"]
        type:
          type: string
        state:
          anyOf:
            - $ref: "#/components/schemas/IssueState"
            - type: "null"

    DataResponse:
      type: object
      description: |
        A dataset's values, described by themselves. Coordinates and variables are keyed by name.
      required: [dataset_id, version, feature_type, query, coordinates, variables, issues]
      properties:
        dataset_id:
          type: integer
          examples: [123]
        version:
          type: integer
          description: The dataset's version. Also sent as the `ETag` header.
          examples: [14]
        feature_type:
          $ref: "#/components/schemas/FeatureTypeName"
        query:
          $ref: "#/components/schemas/DataQuery"
        coordinates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DataCoordinate"
        variables:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DataVariable"
        issues:
          type: array
          description: Issues that overlap the requested time, depths and variables.
          items:
            $ref: "#/components/schemas/IssueSummary"

    LatestVariable:
      type: object
      required: [parameter, unit, time, coordinates, values]
      properties:
        parameter:
          type: [string, "null"]
        unit:
          type: [string, "null"]
        time:
          type: [string, "null"]
          format: date-time
          description: Time of the latest valid value, or `null` if the variable has none.
        coordinates:
          type: object
          description: The other coordinates of the values, e.g. depth. Empty for a time series.
          additionalProperties:
            type: object
            required: [unit, values]
            properties:
              unit:
                type: [string, "null"]
              values:
                type: array
                items: {}
        values:
          description: A single value for a time series, or one value per depth.
          type: [number, array, "null"]
          items:
            type: [number, "null"]

    LatestResponse:
      type: object
      required: [dataset_id, version, feature_type, variables, issues]
      properties:
        dataset_id:
          type: integer
        version:
          type: integer
        feature_type:
          $ref: "#/components/schemas/FeatureTypeName"
        variables:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LatestVariable"
        issues:
          type: array
          description: Open issues on the returned variables.
          items:
            $ref: "#/components/schemas/IssueSummary"

    Profile:
      type: object
      description: One cast of a profile dataset.
      required: [time, latitude, longitude, depth_min, depth_max, levels, data_url]
      properties:
        time:
          type: string
          format: date-time
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        depth_min:
          type: [number, "null"]
        depth_max:
          type: [number, "null"]
        levels:
          type: integer
          description: Number of depths in the cast.
        data_url:
          type: string
          format: uri-reference
          description: The data endpoint's URL for this cast alone.

    ProfilePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Profile"

    # -------------------------------------------------------------------------
    # Availability
    # -------------------------------------------------------------------------
    AvailabilityInterval:
      type: object
      description: A period with valid data, after merging short gaps.
      required: [start, end, valid_count]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        valid_count:
          type: integer
          description: Number of valid values in the period (over all depths).

    AvailabilityPeriod:
      type: object
      description: A day, month or year with data.
      required: [start, fraction]
      properties:
        start:
          type: string
          format: date-time
          description: Start of the day, month or year.
        fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the period covered by intervals with valid data.

    AvailabilityVariable:
      type: object
      description: When one variable has data. `intervals` is filled for `resolution=raw`, `periods` otherwise.
      required: [intervals, periods]
      properties:
        intervals:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/AvailabilityInterval"
        periods:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/AvailabilityPeriod"

    Availability:
      type: object
      description: When a dataset has valid data, per variable.
      required: [dataset_id, version, resolution, variables, issues]
      properties:
        dataset_id:
          type: integer
        version:
          type: integer
        resolution:
          type: string
          enum: [raw, day, month, year]
        variables:
          type: object
          description: Data variables, keyed by name.
          additionalProperties:
            $ref: "#/components/schemas/AvailabilityVariable"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"

    DatasetAvailability:
      type: object
      description: A dataset with data in the requested period.
      required: [dataset_id, title, feature_type, site_id, latitude, longitude, first, last, fraction]
      properties:
        dataset_id:
          type: integer
        title:
          type: string
        feature_type:
          $ref: "#/components/schemas/FeatureTypeName"
        site_id:
          type: [integer, "null"]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        first:
          type: string
          format: date-time
          description: First valid value in the period.
        last:
          type: string
          format: date-time
          description: Last valid value in the period.
        fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the period covered by valid data of any (matching) variable.

    DatasetAvailabilityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DatasetAvailability"

    # -------------------------------------------------------------------------
    # Exports
    # -------------------------------------------------------------------------
    ExportRequest:
      type: object
      description: What to export. The same query as the data endpoint, plus a format.
      required: [dataset_id, format]
      properties:
        dataset_id:
          type: integer
          examples: [123]
        variables:
          type: array
          description: Variables to export. Leave it out for all.
          items:
            type: string
          examples: [[temperature]]
        start:
          type: [string, "null"]
          description: A date or a full timestamp. Leave it out to start at the dataset's first value.
          examples: ["2019-01-01"]
        end:
          type: [string, "null"]
          description: A date (the whole day) or a full timestamp. Leave it out to end at the dataset's last value.
          examples: ["2023-12-31"]
        depth_min:
          type: [number, "null"]
        depth_max:
          type: [number, "null"]
        resample:
          type: [string, "null"]
          pattern: "^[0-9]+(min|h|D|W|M|Y)$"
          examples: [1h]
        mask:
          type: boolean
          default: false
        format:
          type: string
          enum: [netcdf, csv]

    ExportEstimate:
      type: object
      required: [size, values, existing]
      properties:
        size:
          type: integer
          description: Estimated size of the zip file, in bytes.
        values:
          type: integer
          description: Number of values in the export.
        existing:
          type: [string, "null"]
          description: ID of an identical export that's ready, or `null`.

    ExportStatus:
      type: string
      description: "`queued` → `running` → `ready`, or `failed`. A deleted export becomes `expired`."
      enum: [queued, running, ready, failed, expired]

    Export:
      type: object
      description: A file prepared in the background with a subset of a dataset.
      required: [id, dataset_id, version, query, status, progress, size, error, job_id, created_at, ready_at, expires_at, download_url, url]
      properties:
        id:
          type: string
          description: Hash of the dataset, its version and the query. Identical requests share an export.
          examples: [9f2c4e7a1b3d5f60]
        dataset_id:
          type: integer
        version:
          type: integer
          description: The dataset version exported.
        query:
          $ref: "#/components/schemas/ExportRequest"
        status:
          $ref: "#/components/schemas/ExportStatus"
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        size:
          type: [integer, "null"]
          description: Size of the zip file in bytes, once it's ready.
        error:
          type: [string, "null"]
        job_id:
          type: [integer, "null"]
          description: The worker job preparing the export.
        created_at:
          type: string
          format: date-time
        ready_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the file will be deleted, at the latest.
        download_url:
          type: [string, "null"]
          format: uri-reference
          description: Where to download the file, once it's ready.
        url:
          type: string
          format: uri-reference
          description: Poll this URL to follow the export.

    # -------------------------------------------------------------------------
    # Maintenance
    # -------------------------------------------------------------------------
    RegenerateRequest:
      type: object
      properties:
        dataset_ids:
          type: [array, "null"]
          description: Datasets to rebuild. Leave it out for all datasets except link datasets.
          items:
            type: integer
        only_failed:
          type: boolean
          default: false
          description: Only rebuild the datasets whose rebuild failed in the previous run.
        sync:
          type: boolean
          default: false
          description: Sync each dataset from its source before rebuilding it.

    RegenerateRun:
      type: object
      description: A run that rebuilds many datasets.
      required: [id, status, dataset_ids, only_failed, sync, total, done, failed, remaining, failures, created_at, finished_at, url]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [running, finished, stopped]
        dataset_ids:
          type: [array, "null"]
          description: The datasets asked for, or `null` for all.
          items:
            type: integer
        only_failed:
          type: boolean
        sync:
          type: boolean
        total:
          type: integer
          description: Number of datasets in the run.
        done:
          type: integer
          description: Datasets rebuilt successfully.
        failed:
          type: integer
        remaining:
          type: integer
        failures:
          type: array
          items:
            type: object
            required: [dataset_id, job_id, error]
            properties:
              dataset_id:
                type: integer
              job_id:
                type: integer
              error:
                type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        url:
          type: string
          format: uri-reference

    SyncToken:
      type: object
      required: [dataset_id, token, created_at]
      properties:
        dataset_id:
          type: integer
        token:
          type: string
          description: "Send it as `Authorization: Bearer <token>` to the sync endpoint. Shown only once."
        created_at:
          type: string
          format: date-time

  parameters:
    limit:
      name: limit
      in: query
      description: Most entries to return on one page.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    offset:
      name: offset
      in: query
      description: Number of entries to skip, for the next pages.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    start:
      name: start
      in: query
      description: Start of the time range, inclusive. A date (`2024-03-01`, meaning midnight UTC) or a full ISO 8601 timestamp.
      schema:
        type: string
      examples:
        date:
          summary: A date
          value: "2024-03-01"
        timestamp:
          summary: A full timestamp
          value: "2024-03-01T00:00:00Z"
    end:
      name: end
      in: query
      description: End of the time range, inclusive. A date (`2024-03-31`, meaning the whole day in UTC) or a full ISO 8601 timestamp. Must not be before `start`.
      schema:
        type: string
      examples:
        date:
          summary: A date
          value: "2024-03-31"
        timestamp:
          summary: A full timestamp
          value: "2024-03-31T23:59:59Z"
    bbox:
      name: bbox
      in: query
      description: Only results inside this box, given as `min_lon,min_lat,max_lon,max_lat` in WGS 84 degrees.
      schema:
        type: string
        pattern: "^-?[0-9]+(\\.[0-9]+)?(,-?[0-9]+(\\.[0-9]+)?){3}$"
      example: "6.1,46.2,7.0,46.6"
    dataset_id:
      name: dataset_id
      in: path
      required: true
      description: Dataset ID.
      schema:
        type: integer
      example: 123
    variable_id:
      name: variable_id
      in: path
      required: true
      description: Variable ID.
      schema:
        type: integer
      example: 903
    site_id:
      name: site_id
      in: path
      required: true
      description: Site ID.
      schema:
        type: integer
      example: 1
    collection_id_or_slug:
      name: collection_id_or_slug
      in: path
      required: true
      description: Collection ID (e.g. `2`) or slug (e.g. `lexplore`).
      schema:
        type: string
      example: lexplore
    issue_id:
      name: issue_id
      in: path
      required: true
      description: Issue ID.
      schema:
        type: integer
      example: 77
    vocabulary_name:
      name: vocabulary_name
      in: path
      required: true
      description: Name of the vocabulary.
      schema:
        type: string
        enum: [parameters, organisations, persons, sensors, licenses, site_types, feature_types, variable_roles]
      example: sensors
    job_id:
      name: job_id
      in: path
      required: true
      description: Job ID.
      schema:
        type: integer
      example: 5812
    job_status:
      name: status
      in: query
      description: Only jobs with this status.
      schema:
        $ref: "#/components/schemas/JobStatus"
      example: failed
    job_type:
      name: type
      in: query
      description: Only jobs of this type.
      schema:
        $ref: "#/components/schemas/JobType"
      example: sync
    variables:
      name: variables
      in: query
      description: Variables to return, by name, separated by commas. Leave it out for all variables.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      example: [temperature]
    data_start:
      name: start
      in: query
      description: Start of the time range, inclusive. A date (`2024-03-01`, meaning midnight UTC) or a full ISO 8601 timestamp. Leave it out to start at the dataset's first value.
      schema:
        type: string
      example: "2024-03-01"
    data_end:
      name: end
      in: query
      description: End of the time range, inclusive. A date (`2024-03-31`, meaning the whole day in UTC) or a full ISO 8601 timestamp. Leave it out to end at the dataset's last value.
      schema:
        type: string
      example: "2024-03-31"
    depth_min:
      name: depth_min
      in: query
      description: Shallowest depth to return, in metres, inclusive. Only for datasets with depth.
      schema:
        type: number
        minimum: 0
      example: 0
    depth_max:
      name: depth_max
      in: query
      description: Deepest depth to return, in metres, inclusive. Only for datasets with depth.
      schema:
        type: number
        minimum: 0
      example: 10
    resample:
      name: resample
      in: query
      description: |
        Average the values over fixed time steps: a number and a unit, `min`, `h`, `D` (day), `W` (week), `M` (month) or `Y` (year). Steps start at midnight UTC. Flag variables take the worst flag in each step.
      schema:
        type: string
        pattern: "^[0-9]+(min|h|D|W|M|Y)$"
      example: 1D
    max_points:
      name: max_points
      in: query
      description: Most time steps to return. If there are more, the values are resampled with the smallest step from a fixed list that fits. Ignored when `resample` already gives few enough steps.
      schema:
        type: integer
        minimum: 10
        maximum: 100000
      example: 2000
    mask:
      name: mask
      in: query
      description: "Replace values covered by a problem (an issue with `category: problem`) or flagged as bad with `null`. Events never mask values."
      schema:
        type: boolean
        default: false
      example: false
    format:
      name: format
      in: query
      description: Response format.
      schema:
        type: string
        enum: [json, csv, netcdf]
        default: json
      example: json
    if_none_match:
      name: If-None-Match
      in: header
      description: The `ETag` of an earlier response. If the dataset hasn't changed since, the answer is 304 without a body.
      schema:
        type: string
      example: '"123-v14"'
    export_id:
      name: export_id
      in: path
      required: true
      description: Export ID, a hash of the dataset, its version and the query.
      schema:
        type: string
      example: 9f2c4e7a1b3d5f60
    run_id:
      name: run_id
      in: path
      required: true
      description: Regenerate run ID.
      schema:
        type: integer
      example: 7

  headers:
    ETag:
      description: The dataset and its version, e.g. `"123-v14"`. It changes whenever the dataset's data or metadata changes. Send it back in `If-None-Match` to get 304 when nothing changed.
      schema:
        type: string
      example: '"123-v14"'
    X-Cache:
      description: "`HIT` when the response came from the cache, `MISS` when it was computed."
      schema:
        type: string
        enum: [HIT, MISS]
      example: HIT

  responses:
    BadRequest:
      description: The request makes no sense, e.g. `start` is after `end`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "start (2024-03-31) is after end (2024-03-01)"
            code: invalid_time_range
    NotModified:
      description: The dataset hasn't changed since the `ETag` sent in `If-None-Match`. No body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    NoData:
      description: The dataset doesn't exist, has no data yet, or is a link dataset.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found:
              summary: The dataset doesn't exist
              value:
                detail: Dataset 999 not found
                code: not_found
            no_data:
              summary: The dataset has no data yet
              value:
                detail: Dataset 512 has no data yet. Sync it first.
                code: no_data
            link_dataset:
              summary: A link dataset
              value:
                detail: Dataset 2 is a link dataset. Its data is at https://www.alplakes.eawag.ch/geneva
                code: link_dataset
    NotFound:
      description: The resource doesn't exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Dataset 999 not found
            code: not_found
    Conflict:
      description: A sync of the dataset is already queued or running. Try again when it has ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Dataset 123 is already syncing (job 5812)
            code: job_in_progress
    SourceValidationError:
      description: The source config is invalid, e.g. it contains credentials or an option its backend doesn't accept.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            credentials:
              $ref: "#/components/examples/CredentialsRejected"
            unknown_option:
              $ref: "#/components/examples/UnknownOptionRejected"
            password_share:
              summary: A password-protected SWITCHdrive share
              value:
                detail: This SWITCHdrive share is protected by a password. Sources are read anonymously, so remove the password from the share.
                code: credentials_not_allowed
    TooLarge:
      description: A synchronous response would be too large. Create an export instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TooLargeError"
    ValidationError:
      description: The request is invalid, e.g. a field has the wrong type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            wrong_type:
              summary: A field has the wrong type
              value:
                detail: Invalid request
                code: validation_error
                errors:
                  - loc: [query, limit]
                    msg: Input should be less than or equal to 1000
    JobAccepted:
      description: The work was queued. Poll the job's `url` to follow it.
      headers:
        Location:
          description: URL of the job.
          schema:
            type: string
            format: uri-reference
          example: /jobs/5812
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
          examples:
            sync:
              $ref: "#/components/examples/QueuedSyncJob"
            inspect:
              summary: A queued inspect
              value:
                id: 5813
                dataset_id: 512
                type: inspect
                status: queued
                progress: null
                error: null
                log: ""
                result: null
                created_at: "2024-10-30T10:30:00Z"
                started_at: null
                finished_at: null
                url: /jobs/5813

