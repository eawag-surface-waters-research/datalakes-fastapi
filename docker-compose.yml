version: "3.9"
services:
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  fastapi-app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      FILESYSTEM: "/code/filesystem"
      API_KEY: "${API_KEY}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      PRODUCTION: "${PRODUCTION}"
      SOURCE_ALLOW_PRIVATE_ENDPOINTS: "${SOURCE_ALLOW_PRIVATE_ENDPOINTS}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI}"
      GITHUB_ORG: "${GITHUB_ORG}"
      GITHUB_TEAM_SLUG: "${GITHUB_TEAM_SLUG}"
    container_name:
      datalakes-fastapi
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes:
      - "${FILESYSTEM}:/code/filesystem:ro"
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    build: .
    command: ["python", "-m", "app.main", "--worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      FILESYSTEM: "/code/filesystem"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      PRODUCTION: "${PRODUCTION}"
      SOURCE_ALLOW_PRIVATE_ENDPOINTS: "${SOURCE_ALLOW_PRIVATE_ENDPOINTS}"
    container_name:
      datalakes-worker
    restart: unless-stopped
    stop_grace_period: 30s # time to queue the running jobs again before Docker kills the worker
    volumes:
      - "${FILESYSTEM}:/code/filesystem"
    extra_hosts:
      - "host.docker.internal:host-gateway"
