[project]
name = "datalakes-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 150
respect-gitignore = true
indent-width = 2
fix = true

[tool.ruff.lint]
# enable fixing isort
extend-select = ["I"]
